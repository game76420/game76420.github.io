<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扇形杯套文字排版工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--fg:#1c1c1a;--card:#fff;--bd:#d8d6d0;--ac:#c2410c;--mut:#6b6a66;--pv:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ece9e2;--card:#222220;--bd:#3a3935;--ac:#fb923c;--mut:#9a978f;--pv:#2a2a28}}
:root[data-theme="dark"]{--bg:#171716;--fg:#ece9e2;--card:#222220;--bd:#3a3935;--ac:#fb923c;--mut:#9a978f;--pv:#2a2a28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px}
@media(min-width:900px){main{grid-template-columns:1.3fr 1fr;align-items:start}.pv{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.pvbox{background:var(--pv);border:1px solid var(--bd);border-radius:12px;padding:6px;overflow-x:auto}
.pvbox svg{width:100%;height:auto;display:block;max-height:42vh}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;min-width:0}
input[type=color]{padding:2px;height:36px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
button.x{color:#dc2626}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.info{font-size:12px;color:var(--mut);margin-top:8px}
textarea{width:100%;height:120px;font:11px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;display:none;margin-top:8px}
.full{grid-column:1/-1}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#v3{display:block;margin-top:10px}#v3c{background:var(--pv);border:1px solid var(--bd);border-radius:12px;overflow:hidden}#v3c canvas{display:block;width:100%!important;touch-action:pan-y;cursor:grab}
</style>
</head>
<body>
<main>
<section class="pv">
  <h1>扇形杯套文字排版工具</h1>
  <p class="sub">文字會沿著扇形弧線排列，貼回杯子後不會變形。</p>
  <div class="info" style="margin:0 0 4px">2D 展開圖</div>
  <div class="pvbox" id="pv"></div>
  <div id="v3"><div class="info" style="margin:0 0 4px">3D 預覽</div><div id="v3c"></div>
    <div class="row"><button id="auto">暫停旋轉</button><button id="reset">重設視角</button><span class="info" style="margin:0">左右拖曳旋轉（電腦可上下拖曳傾斜、滾輪縮放）</span></div></div>
  <div class="info" id="info"></div>
  <div class="row">
    <button class="p" id="dl">下載 SVG</button>
    <button id="cp">複製 SVG 原始碼</button>
    <label class="chk"><input type="checkbox" id="guides" checked>輸出含刀模線</label>
  </div>
  <textarea id="ta" readonly></textarea>
</section>

<section>
  <div class="card">
    <b>杯子尺寸（mm）</b>
    <div class="g2" style="grid-template-columns:repeat(3,1fr)">
      <label>杯口外徑<input type="number" id="top" value="90" step="0.5"></label>
      <label>杯底外徑<input type="number" id="bot" value="60" step="0.5"></label>
      <label>杯身高度<input type="number" id="h" value="95" step="0.5"></label>
    </div>
    <div class="g2">
      <label>杯底留白（mm）<input type="number" id="safe" value="4" step="0.5"></label>
      <label>杯身底色<input type="color" id="bg" value="#ffffff"></label>
    </div>
    <div class="g2">
      <label>封邊（黏貼）寬度 (mm)<input type="number" id="ov" value="6" step="0.5" min="0"></label>
      <label>封邊位置<select id="ovs"><option value="R">右側</option><option value="L">左側</option></select></label>
    </div>
    <div class="g2">
      <label>出血 (mm)<input type="number" id="bl" value="3" step="0.5" min="0"></label>
    </div>
  </div>
  <div class="card"><b>圖片（自動變形成扇形）</b>
    <div class="row"><input type="file" id="file" accept="image/*" multiple></div>
    <div class="info">直接上傳沒有變形的平面圖（JPG／PNG）即可，工具會依扇形弧線自動套用變形。圖片在文字下方。</div>
    <div id="imgs"></div></div>
  <div id="layers"></div>
  <button class="p" id="add" style="width:100%">＋ 新增文字</button>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const FONTS=[["黑體","Noto Sans TC, sans-serif"],["明體","Noto Serif TC, serif"],["Arial","Arial, sans-serif"],["Georgia","Georgia, serif"],["Courier","Courier New, monospace"]];
let layers=[
 {t:"COFFEE",f:FONTS[0][1],s:14,y:48,dx:0,ls:1,c:"#7c2d12",b:true},
 {t:"手沖咖啡 · 每日現磨",f:FONTS[0][1],s:6,y:34,dx:0,ls:1,c:"#1c1c1a",b:false}
];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const n=id=>parseFloat($(id).value)||0;
const f2=v=>+v.toFixed(3);

function geo(){
  const top=n("top"),bot=Math.min(n("bot"),top-0.1),h=n("h");
  const L=Math.hypot(h,(top-bot)/2);
  const Rt=L*top/(top-bot),Rb=Rt-L,a0=Math.PI*top/Rt,ao=Math.max(0,n("ov"))/Rt,a=a0+ao;
  const fs=$("ovs").value==="R"?-ao/2:ao/2;
  const half=a/2,bl=Math.max(0,n("bl")),Ro=Rt+bl,Ri=Math.max(0.1,Rb-bl);
  const ho=half+Math.asin(Math.min(1,bl/Ro)),hI=half+Math.asin(Math.min(1,bl/Ri));
  const xs=Math.max(Ro*Math.sin(Math.min(ho,Math.PI/2)),Ri*Math.sin(Math.min(hI,Math.PI/2)));
  const y1=Math.max(-Ri*Math.cos(hI),-Ro*Math.cos(ho));
  return{L,Rt,Rb,a,top,a0,ao,fs,bx:{x:-xs,y:-Ro,w:2*xs,h:y1+Ro,bl,Ro,Ri,ho,hi:hI}};
}
function build(withGuides,bgc,hi){
  const{L,Rt,Rb,a,a0,ao,fs}=geo(),half=a/2,pad=8,large=a>Math.PI?1:0;
  const P=(r,t)=>f2(r*Math.sin(t))+" "+f2(-r*Math.cos(t));
  const B=geo().bx,xs=-B.x;
  const vw=2*xs+2*pad,vh=B.h+2*pad;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f2(vw)}mm" height="${f2(vh)}mm" viewBox="${f2(-xs-pad)} ${f2(B.y-pad)} ${f2(vw)} ${f2(vh)}">`;
  if(bgc)s+=`<rect x="${f2(-xs-pad)}" y="${f2(B.y-pad)}" width="${f2(vw)}" height="${f2(vh)}" fill="${bgc}"/>`;
  let defs="",txt="";
  layers.forEach((l,i)=>{
    if(l.on===false)return;const r=Rb+l.y;
    defs+=`<path id="arc${i}" d="M ${P(r,-half)} A ${f2(r)} ${f2(r)} 0 ${large} 1 ${P(r,half)}"/>`;
    txt+=`<text font-family="${esc(l.f)}" font-size="${l.s}" font-weight="${l.b?700:400}" letter-spacing="${l.ls}" fill="${l.c}" text-anchor="middle"><textPath href="#arc${i}" startOffset="${f2(r*(half+fs)+l.dx)}">${esc(l.t)}</textPath></text>`;
  });
  let pic="";const kk=hi?Math.min(10,3000/(2*xs)):4;
  images.forEach((im,i)=>{if(im.on===false)return;pic+=`<image id="img${i}" x="${f2(B.x)}" y="${f2(B.y)}" width="${f2(B.w)}" height="${f2(B.h)}" xlink:href="${warpURI(im,kk)}"/>`;});
  s+=`<defs>${defs}</defs><g id="artwork">${pic}${txt}</g>`;
  if(withGuides){
    const sf=Rb+n("safe");
    let ovg="",bld="";
    if(B.bl>0){const lO=2*B.ho>Math.PI?1:0,lI=2*B.hi>Math.PI?1:0;
      bld=`<path stroke="#06b6d4" stroke-dasharray="2 1" d="M ${P(B.Ri,-B.hi)} L ${P(B.Ro,-B.ho)} A ${f2(B.Ro)} ${f2(B.Ro)} 0 ${lO} 1 ${P(B.Ro,B.ho)} L ${P(B.Ri,B.hi)} A ${f2(B.Ri)} ${f2(B.Ri)} 0 ${lI} 0 ${P(B.Ri,-B.hi)} Z"/>`;}
    if(ao>1e-6){const right=fs<0,b=right?fs+a0/2:fs-a0/2,e=right?half:-half;
      ovg=`<path fill="#f59e0b" fill-opacity="0.18" stroke="none" d="M ${P(Rb,b)} L ${P(Rt,b)} A ${f2(Rt)} ${f2(Rt)} 0 0 ${right?1:0} ${P(Rt,e)} L ${P(Rb,e)} A ${f2(Rb)} ${f2(Rb)} 0 0 ${right?0:1} ${P(Rb,b)} Z"/><path stroke="#f59e0b" stroke-dasharray="1.5 1" d="M ${P(Rb,b)} L ${P(Rt,b)}"/>`;}
    s+=`<g id="guides" fill="none" stroke-width="0.3"><path stroke="#e11d48" stroke-dasharray="2 1" d="M ${P(Rb,-half)} L ${P(Rt,-half)} A ${f2(Rt)} ${f2(Rt)} 0 ${large} 1 ${P(Rt,half)} L ${P(Rb,half)} A ${f2(Rb)} ${f2(Rb)} 0 ${large} 0 ${P(Rb,-half)} Z"/>`+
    `<path stroke="#2563eb" stroke-dasharray="1 1" d="M ${P(sf,-half)} A ${f2(sf)} ${f2(sf)} 0 ${large} 1 ${P(sf,half)}"/>`+
    `<path stroke="#16a34a" stroke-dasharray="0.6 1.4" d="M ${P(Rb,fs)} L ${P(Rt,fs)}"/>`+ovg+bld+`</g>`;
  }
  return s+"</svg>";
}
function draw(){
  $("pv").innerHTML=build(true,$("bg").value);
  schedule3d();
  const g=geo();
  $("info").textContent=`扇形角度 ${(g.a*180/Math.PI).toFixed(2)}°　外半徑 ${g.Rt.toFixed(1)} mm　內半徑 ${g.Rb.toFixed(1)} mm　斜高 ${g.L.toFixed(1)} mm　紅線＝刀模，藍線＝杯底留白，綠線＝中線`;
}
function ui(){
  $("layers").innerHTML=layers.map((l,i)=>`<div class="card" data-i="${i}"><div class="g">
  <label class="full">文字<input data-k="t" value="${esc(l.t)}"></label>
  <label>字型<select data-k="f">${FONTS.map(([nm,v])=>`<option value="${esc(v)}"${v===l.f?" selected":""}>${nm}</option>`)}</select></label>
  <label>字級 (mm)<input data-k="s" type="number" step="0.5" value="${l.s}"></label>
  <label>字距<input data-k="ls" type="number" step="0.5" value="${l.ls}"></label>
  <label>距杯底 (mm)<input data-k="y" type="number" step="0.5" value="${l.y}"></label>
  <label>左右偏移 (mm)<input data-k="dx" type="number" step="0.5" value="${l.dx}"></label>
  <label>顏色<input data-k="c" type="color" value="${l.c}"></label></div>
  <div class="row"><label class="chk"><input data-k="on" type="checkbox"${l.on!==false?" checked":""}>顯示</label><label class="chk"><input data-k="b" type="checkbox"${l.b?" checked":""}>粗體</label><button class="x" data-del="${i}" style="margin-left:auto">刪除</button></div></div>`).join("");
}
$("layers").addEventListener("input",e=>{
  const k=e.target.dataset.k;if(!k)return;
  const l=layers[e.target.closest(".card").dataset.i];
  l[k]=(k==="b"||k==="on")?e.target.checked:(["t","f","c"].includes(k)?e.target.value:parseFloat(e.target.value)||0);
  draw();
});
$("layers").addEventListener("click",e=>{
  if(e.target.dataset.del!==undefined){layers.splice(+e.target.dataset.del,1);ui();draw();}
});
$("add").onclick=()=>{layers.push({t:"新文字",f:FONTS[0][1],s:8,y:20,dx:0,ls:0,c:"#1c1c1a",b:false});ui();draw();};
["top","bot","h","safe","bg","ov","ovs","bl"].forEach(id=>$(id).addEventListener("input",draw));

const out=()=>{const s=build($("guides").checked,null,true);images.forEach(im=>{im.c={};im.u={};});return s;};
let dl=null;
(async()=>{try{dl=await window.claude.use("downloads");}catch(e){}})();
$("dl").onclick=async()=>{
  const svg='<?xml version="1.0" encoding="UTF-8"?>\n'+out();
  try{ if(dl){await dl.save({filename:"cup-wrap.svg",data:svg});return;} }catch(e){ if(e&&e.code==="declined")return; }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));a.download="cup-wrap.svg";document.body.appendChild(a);a.click();a.remove();}catch(e){}
  showCode(svg);
};
$("cp").onclick=async()=>{
  const svg=out();
  try{await navigator.clipboard.writeText(svg);$("cp").textContent="已複製 ✓";setTimeout(()=>$("cp").textContent="複製 SVG 原始碼",1500);}
  catch(e){showCode(svg);}
};
function showCode(svg){const t=$("ta");t.style.display="block";t.value=svg;t.select();}
/* ---------- 圖片變形 ---------- */
let images=[];
const imgSig=(im,k)=>{const g=geo();return [g.Rt,g.Rb,g.a,g.fs,g.bx.bl,im.w,im.h,im.y,im.dx,k].join();};
function warpCanvas(im,k){
  const sig=imgSig(im,k);im.c=im.c||{};
  if(im.c[k]&&im.c[k].sig===sig)return im.c[k].cv;
  const{Rt,Rb,a,fs,bx}=geo(),half=a/2,vx0=bx.x,vy0=bx.y,vw=bx.w,vh=bx.h,bl=bx.bl;
  const cw=Math.ceil(vw*k),ch=Math.ceil(vh*k);
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
  if(!(im.w>.1&&im.h>.1)){im.c[k]={sig,cv};return cv;}
  const ctx=cv.getContext("2d"),out=ctx.createImageData(cw,ch),o=out.data;
  const sw=Math.max(2,Math.min(im.img.naturalWidth,Math.ceil(im.w*k))),sh=Math.max(2,Math.min(im.img.naturalHeight,Math.ceil(im.h*k)));
  const sc=document.createElement("canvas");sc.width=sw;sc.height=sh;
  const sx=sc.getContext("2d");sx.imageSmoothingQuality="high";sx.drawImage(im.img,0,0,sw,sh);
  const s=sx.getImageData(0,0,sw,sh).data,rc=Rb+im.y,phi0=im.dx/rc+fs;
  for(let py=0;py<ch;py++){const Y=vy0+(py+.5)/k;
    for(let px=0;px<cw;px++){
      const X=vx0+(px+.5)/k,r=Math.hypot(X,Y);
      if(r<Rb-bl||r>Rt+bl)continue;
      const phi=Math.atan2(X,-Y),lim=half+Math.asin(Math.min(1,bl/r));if(phi<-lim||phi>lim)continue;
      const u=((phi-phi0)*rc+im.w/2)/im.w,v=(rc+im.h/2-r)/im.h;
      if(u<0||u>1||v<0||v>1)continue;
      const fx=Math.min(sw-1,Math.max(0,u*sw-.5)),fy=Math.min(sh-1,Math.max(0,v*sh-.5));
      const x0=fx|0,y0=fy|0,x1=Math.min(sw-1,x0+1),y1=Math.min(sh-1,y0+1),tx=fx-x0,ty=fy-y0,i=(py*cw+px)*4;
      for(let c=0;c<4;c++){
        const p00=s[(y0*sw+x0)*4+c],p10=s[(y0*sw+x1)*4+c],p01=s[(y1*sw+x0)*4+c],p11=s[(y1*sw+x1)*4+c];
        o[i+c]=(p00*(1-tx)+p10*tx)*(1-ty)+(p01*(1-tx)+p11*tx)*ty;
      }
    }}
  ctx.putImageData(out,0,0);im.c[k]={sig,cv};return cv;
}
function warpURI(im,k){
  const sig=imgSig(im,k);im.u=im.u||{};
  if(!im.u[k]||im.u[k].sig!==sig)im.u[k]={sig,uri:warpCanvas(im,k).toDataURL("image/png")};
  return im.u[k].uri;
}
function imgUi(){
  $("imgs").innerHTML=images.map((im,j)=>`<div class="card" data-j="${j}" style="margin:8px 0 0"><div style="font-size:13px;margin-bottom:6px;word-break:break-all">${esc(im.name)}</div><div class="g">
  <label>寬 (mm)<input data-k="w" type="number" step="0.5" value="${im.w}"></label>
  <label>高 (mm)<input data-k="h" type="number" step="0.5" value="${im.h}"></label>
  <label>中心距杯底 (mm)<input data-k="y" type="number" step="0.5" value="${im.y}"></label>
  <label>左右偏移 (mm)<input data-k="dx" type="number" step="0.5" value="${im.dx}"></label></div>
  <div class="row"><label class="chk"><input data-k="on" type="checkbox"${im.on!==false?" checked":""}>顯示</label><label class="chk"><input data-k="lock" type="checkbox"${im.lock?" checked":""}>鎖定比例</label><button data-fill="${j}">滿版（拉伸）</button><button class="x" data-del="${j}" style="margin-left:auto">刪除</button></div></div>`).join("");
}
$("imgs").addEventListener("input",e=>{
  const k=e.target.dataset.k;if(!k)return;
  const card=e.target.closest(".card"),im=images[card.dataset.j];
  if(k==="on"){im.on=e.target.checked;draw();return;}
  if(k==="lock"){im.lock=e.target.checked;return;}
  im[k]=parseFloat(e.target.value)||0;
  const ra=im.img.naturalHeight/im.img.naturalWidth;
  if(im.lock&&k==="w"&&im.w>0){im.h=+(im.w*ra).toFixed(2);card.querySelector('[data-k="h"]').value=im.h;}
  if(im.lock&&k==="h"&&im.h>0){im.w=+(im.h/ra).toFixed(2);card.querySelector('[data-k="w"]').value=im.w;}
  draw();
});
$("imgs").addEventListener("click",e=>{
  const d=e.target.dataset;
  if(d.del!==undefined){images.splice(+d.del,1);imgUi();draw();}
  if(d.fill!==undefined){const im=images[+d.fill],g=geo();const rc=g.Rb+g.L/2,bl=g.bx.bl;im.w=+((g.a+2*Math.asin(Math.min(1,bl/Math.max(.1,g.Rb-bl))))*rc).toFixed(1);im.h=+(g.L+2*bl).toFixed(1);im.y=+(g.L/2).toFixed(1);im.dx=+(-g.fs*(g.Rb+g.L/2)).toFixed(1);im.lock=false;imgUi();draw();}
});
$("file").onchange=e=>{
  [...e.target.files].forEach(f=>{
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const g=geo(),ra=img.naturalHeight/img.naturalWidth;
      let w=Math.min(g.a*(g.Rb+g.L/2)*.5,60),h=w*ra;
      if(h>g.L*.9){h=g.L*.9;w=h/ra;}
      images.push({img,name:f.name,w:+w.toFixed(1),h:+h.toFixed(1),y:+(g.L/2).toFixed(1),dx:0,lock:true});
      imgUi();draw();
    };img.src=rd.result;};
    rd.readAsDataURL(f);
  });
  e.target.value="";
};
/* ---------- 3D ---------- */
let T=null,texTimer=0,view="2d",tok=0;
function setView(v){
  view=v;$("pv").style.display=v==="2d"?"":"none";$("v3").style.display=v==="3d"?"block":"none";
  $("t2").classList.toggle("on",v==="2d");$("t3").classList.toggle("on",v==="3d");
  if(v==="3d"){ensure3d();if(T){size3d();update3d();loop();}}
}
view="3d";
function schedule3d(){if(!T||view!=="3d")return;clearTimeout(texTimer);texTimer=setTimeout(update3d,150);}
function ensure3d(){
  if(T)return;
  if(!window.THREE){$("v3c").textContent="3D 函式庫載入失敗";return;}
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  $("v3c").appendChild(renderer.domElement);
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,1,3000);
  scene.add(new THREE.AmbientLight(0xffffff,.8));
  const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(60,120,200);scene.add(dl);
  const group=new THREE.Group();group.rotation.order="YXZ";scene.add(group);
  T={renderer,scene,camera,group,auto:true,yaw:0,pitch:.25,zoom:1,dist:300,parts:[]};
  const el=renderer.domElement;let drag=null;
  el.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];T.auto=false;$("auto").textContent="自動旋轉";el.setPointerCapture(e.pointerId);});
  el.addEventListener("pointermove",e=>{if(!drag)return;T.yaw+=(e.clientX-drag[0])*.01;
    if(e.pointerType==="mouse")T.pitch=Math.max(-.3,Math.min(1,T.pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];});
  const up=()=>{drag=null;};el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  el.addEventListener("wheel",e=>{e.preventDefault();T.zoom=Math.max(.4,Math.min(2.5,T.zoom*(e.deltaY>0?1.08:.92)));},{passive:false});
}
$("auto").onclick=()=>{if(!T)return;T.auto=!T.auto;$("auto").textContent=T.auto?"暫停旋轉":"自動旋轉";};
$("reset").onclick=()=>{if(!T)return;T.yaw=0;T.pitch=.25;T.zoom=1;};
function size3d(){
  if(!T)return;const w=$("v3c").clientWidth||360,hh=Math.min(w,340);
  T.renderer.setSize(w,hh);T.camera.aspect=w/hh;T.camera.updateProjectionMatrix();
}
addEventListener("resize",()=>{if(view==="3d")size3d();});
function loop(){
  if(T.running)return;T.running=true;
  (function f(){
    if(view!=="3d"){T.running=false;return;}
    if(T.auto)T.yaw+=.006;
    T.group.rotation.set(T.pitch,T.yaw,0);
    T.camera.position.set(0,0,T.dist*T.zoom);T.camera.lookAt(0,0,0);
    T.renderer.render(T.scene,T.camera);requestAnimationFrame(f);
  })();
}
async function update3d(){
  if(!T)return;const my=++tok;
  const{Rt,Rb,L,a,a0,fs}=geo(),half=a/2,top=n("top"),bot=Math.min(n("bot"),top-0.1),h=n("h");
  const bx=geo().bx,vx0=bx.x,vy0=bx.y,vw=bx.w,vh=bx.h;
  const k=Math.min(8,2048/Math.max(vw,vh));
  const cv=document.createElement("canvas");cv.width=Math.ceil(vw*k);cv.height=Math.ceil(vh*k);
  const ctx=cv.getContext("2d");
  ctx.fillStyle=$("bg").value;ctx.fillRect(0,0,cv.width,cv.height);
  await Promise.all(layers.map(l=>document.fonts.load((l.b?700:400)+" 20px "+l.f,l.t).catch(()=>{})));
  if(my!==tok)return;
  images.forEach(im=>{if(im.on===false)return;try{ctx.drawImage(warpCanvas(im,k),0,0);}catch(e){}});
  ctx.scale(k,k);ctx.translate(-vx0,-vy0);ctx.textBaseline="alphabetic";
  for(const l of layers){
    if(l.on===false)continue;
    ctx.font=(l.b?700:400)+" "+l.s+"px "+l.f;ctx.fillStyle=l.c;
    const r=Rb+l.y,chars=[...l.t],ws=chars.map(c=>ctx.measureText(c).width);
    let pos=r*(half+fs)+l.dx-(ws.reduce((p,w)=>p+w,0)+l.ls*(chars.length-1))/2;
    chars.forEach((c,i)=>{const w=ws[i],t=-half+(pos+w/2)/r;
      ctx.save();ctx.translate(r*Math.sin(t),-r*Math.cos(t));ctx.rotate(t);ctx.fillText(c,-w/2,0);ctx.restore();pos+=w+l.ls;});
  }
  const N=128,M=10,P=[],UV=[],I=[],tr=top/2,br=bot/2;
  for(let j=0;j<=M;j++){const q=j/M,r=Rb+L*q,rho=br+(tr-br)*q,y=-h/2+h*q;
    for(let i=0;i<=N;i++){const p=fs-a0/2+a0*i/N,psi=(p-fs)/(a0/2)*Math.PI;
      P.push(rho*Math.sin(psi),y,rho*Math.cos(psi));
      UV.push((r*Math.sin(p)-vx0)/vw,1-(-r*Math.cos(p)-vy0)/vh);}}
  for(let j=0;j<M;j++)for(let i=0;i<N;i++){const A=j*(N+1)+i,B=A+1,C=A+N+1,D=C+1;I.push(A,B,C,B,D,C);}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(P,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute(UV,2));
  g.setIndex(I);g.computeVertexNormals();
  const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=T.renderer.capabilities.getMaxAnisotropy();
  const outer=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:tex,roughness:.75,side:THREE.FrontSide}));
  const inner=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xf1ede6,roughness:.9,side:THREE.BackSide}));
  const cap=new THREE.Mesh(new THREE.CircleGeometry(br,48).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:$("bg").value,side:THREE.DoubleSide}));cap.position.y=-h/2;
  const rim=new THREE.Mesh(new THREE.TorusGeometry(tr,Math.max(.6,h*.01),8,72).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0xf4f4f2,roughness:.6}));rim.position.y=h/2;
  T.parts.forEach(m=>{T.group.remove(m);m.geometry.dispose();m.material.map&&m.material.map.dispose();m.material.dispose();});
  T.parts=[outer,inner,cap,rim];T.parts.forEach(m=>T.group.add(m));
  T.dist=Math.max(h,top)*3.2;
}
ui();draw();
ensure3d();if(T){size3d();update3d();loop();}
</script>
