<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杯套設計工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#222;--card:#f0f0f0;--bd:#c8c8c8;--ac:#1473e6;--mut:#6b6b6b;--pv:#d9d9d9;--hd:#e2e2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262626;--fg:#e6e6e6;--card:#323232;--bd:#454545;--ac:#2d8ceb;--mut:#9a9a9a;--pv:#535353;--hd:#2b2b2b}}
:root[data-theme="dark"]{--bg:#262626;--fg:#e6e6e6;--card:#323232;--bd:#454545;--ac:#2d8ceb;--mut:#9a9a9a;--pv:#535353;--hd:#2b2b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.box{background:var(--pv);border:1px solid var(--bd);border-radius:12px;padding:6px;overflow:hidden}
.box svg{width:100%;height:auto;display:block}
#flat{touch-action:none}
#flat svg{user-select:none;-webkit-user-select:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
input,select,button,.btn{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;min-width:0}
input[type=color]{padding:2px;height:36px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button,.btn{cursor:pointer;display:inline-block;text-align:center}
.btn input{display:none}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
button.x{color:#dc2626}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.info{font-size:12px;color:var(--mut);margin-top:6px}
.cap{font-size:12px;color:var(--mut);margin:8px 0 4px}
textarea{width:100%;height:120px;font:11px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;display:none;margin-top:8px}
.full{grid-column:1/-1}
.sl{display:flex;gap:8px;align-items:center}.sl input[type=range]{flex:1;padding:0}.sl input[type=number]{width:84px}
.ly{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;background:var(--bg);cursor:pointer}
.ly.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.ly.over{outline:2px dashed var(--ac)}
.ly .th{width:28px;height:28px;flex:none;border:1px solid var(--bd);border-radius:6px;display:grid;place-items:center;overflow:hidden;font-weight:700;background:var(--card)}
.ly .th img{width:100%;height:100%;object-fit:cover}
.ly .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.ly button{padding:2px 8px}.ly button:disabled{opacity:.35;cursor:default}
#v3c{background:var(--pv);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
#v3c canvas{display:block;width:100%!important;touch-action:pan-y;cursor:grab}
#v3c.lk canvas{cursor:default}
button:disabled{opacity:.4;cursor:default}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--bd);flex:none}
.top h1{font-size:14px;margin:0 6px 0 0;white-space:nowrap}.top .sp{flex:1}.top .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top button{padding:4px 10px;font-size:13px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:64px minmax(0,1fr) 320px}
.tb{background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;padding:6px;align-items:center}
.tb button,.tb .btn{width:50px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;border-color:transparent;background:transparent}
.tb button:hover,.tb .btn:hover{background:var(--bg);border-color:var(--bd)}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ws{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pv)}
.tabs{display:flex;gap:1px;background:var(--hd);border-bottom:1px solid var(--bd);flex:none}
.tabs button{border:0;border-radius:0;background:var(--hd);color:var(--mut);padding:5px 14px;font-size:12px}
.tabs button.on{background:var(--pv);color:var(--fg)}
.views{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}
.vp{flex:1;min-height:0;display:flex;flex-direction:column}
.vp .cap{margin:0 0 4px}
.vp .box{flex:1;min-height:0;background:transparent;border:0;padding:0}
.ws .box svg{width:100%;height:100%}
.ws[data-v="flat"] #vpfan,.ws[data-v="fan"] #vpflat{display:none}
.dock{background:var(--card);border-left:1px solid var(--bd);overflow-y:auto;min-height:0}
.pn{border-bottom:1px solid var(--bd)}
.pn>summary{cursor:pointer;list-style:none;padding:6px 10px;background:var(--hd);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mut);display:flex;justify-content:space-between}
.pn>summary::-webkit-details-marker{display:none}
.pn>summary::after{content:"▾"}.pn:not([open])>summary::after{content:"▸"}
.pb{padding:10px}
.dock .card{border:0;border-radius:0;background:transparent;padding:0;margin:0;box-shadow:none}
.dock textarea{width:calc(100% - 20px);margin:10px}
.sb{flex:none;border-top:1px solid var(--bd);background:var(--card);padding:3px 10px;font-size:11px;color:var(--mut);white-space:nowrap;overflow-x:auto}
@media(max-width:899px){
 body{height:auto;overflow:auto;display:block}
 .app{display:flex;flex-direction:column}
 .tb{flex-direction:row;border-right:0;border-bottom:1px solid var(--bd);overflow-x:auto}
 .vp .box{flex:none;height:62vw;min-height:220px}
 .dock{border-left:0;overflow:visible}
}
#vpflat{position:relative}
textarea.ed{display:block;position:absolute;z-index:5;margin:0;border:1px dashed var(--ac);border-radius:0;outline:none;resize:none;overflow:hidden;white-space:pre;box-sizing:border-box}
#vpflat.tool svg *{cursor:text!important}
.tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg{display:flex}.seg button{flex:1;border-radius:0;padding:4px 0;font-size:12px}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ph{display:block;font-size:11px;color:var(--mut);letter-spacing:.04em;margin-bottom:4px}
textarea.tx,.dock textarea.tx{display:block;width:100%;height:56px;margin:0 0 4px;font-size:13px;line-height:1.4;font-family:inherit}
/* 右側面板：避免橫向溢出（桌面版 320px 寬） */
.dock{overflow-x:hidden}
.g>*,.g2>*,.two>*,.dock label{min-width:0}
label:not(.chk)>input:not([type=checkbox]):not([type=range]),label:not(.chk)>select{width:100%}
.locks{display:flex;flex-wrap:wrap;gap:4px 14px;width:100%}
.locks .chk{font-size:12px}
.dock .row{min-width:0}
/* 3D 預覽籤頁 */
.ws:is([data-v="3d"],[data-v="front"]) #vpflat,.ws:is([data-v="3d"],[data-v="front"]) #vpfan{display:none}
.ws:not([data-v="3d"]):not([data-v="front"]) #vp3d{display:none}
#w3d{display:flex;flex-direction:column;min-height:0}
.ws:is([data-v="3d"],[data-v="front"]) #w3d{flex:1;padding:0}
.ws:is([data-v="3d"],[data-v="front"]) #v3c{flex:1;min-height:0;position:relative}
.ws:is([data-v="3d"],[data-v="front"]) #v3c canvas{position:absolute;left:0;top:0}
.ws:is([data-v="3d"],[data-v="front"]) #w3d .row{flex:none}
#pan.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#v3c.pm canvas{cursor:move}
#rowF{display:none}
.ws[data-v="front"] #rowF{display:flex}
.ws[data-v="front"] .lkl{display:none}
#rowF .sl{flex:1;min-width:180px}#fval{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:899px){.ws:is([data-v="3d"],[data-v="front"]) #v3c{flex:none;height:min(100vw,420px)}.ws:is([data-v="3d"],[data-v="front"]) #w3d{flex:none}}
</style>
</head>
<body>
<header class="top">
  <h1>☕ 杯套設計工具</h1><span class="sp"></span>
  <div class="grp"><label class="chk"><input type="checkbox" id="guides" checked>輸出含刀模線</label><button id="cp">複製 SVG 原始碼</button><button class="p" id="dl">下載 SVG</button></div>
</header>
<div class="app">
  <nav class="tb">
    <button id="tsel" class="on" title="選取工具（V）"><svg viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L10 18z"/></svg>選取</button>
    <button id="addt" title="橫書文字工具（T）：點畫面輸入"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>橫書</button>
    <button id="addv" title="直書文字工具：點畫面輸入"><svg viewBox="0 0 24 24"><path d="M4 5h10M9 5v14M18 6v2M18 11v2M18 16v2"/></svg>直書</button>
    <label class="btn" title="置入圖片"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>圖片<input type="file" id="file" accept="image/*" multiple></label>
    <button id="delsel" class="x" title="刪除選取（Delete）"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>刪除</button>
  </nav>
  <section class="ws" id="ws" data-v="both">
    <div class="tabs"><button data-v="both" class="on">並排</button><button data-v="flat">平面設計</button><button data-v="fan">扇形展開圖</button><button data-v="3d">3D 預覽</button><button data-v="front">正視圖</button></div>
    <div class="views">
      <div class="vp" id="vpflat"><div class="cap">平面設計區</div><div class="box" id="flat"></div></div>
      <div class="vp" id="vpfan"><div class="cap">扇形展開圖（輸出內容）</div><div class="box" id="pv"></div></div>
      <div class="vp" id="vp3d"><div class="cap" id="cap3d">3D 預覽（拖曳旋轉 · 滾輪縮放 · Shift／右鍵拖曳或雙指扭轉＝Z 軸旋轉 · Alt／中鍵拖曳或「平移模式」＝平移）</div></div>
    </div>
  </section>
  <aside class="dock">
    <details class="pn" id="pn3d" open><summary>3D 預覽</summary><div class="pb" id="w3d"><div id="v3c"></div><div class="row" id="rowF"><span class="chk" style="color:var(--mut)">旋轉角度</span><div class="sl"><input type="range" id="fang" min="0" max="359" step="1" value="0"><span id="fval">0°</span></div><button data-a="0" title="設計正中央">0° 正面</button><button data-a="90">90°</button><button data-a="180" title="接縫（封邊）側">180° 背面</button><button data-a="270">270°</button></div><div class="row" style="margin-top:6px"><button id="auto">暫停旋轉</button><button id="pan" title="開啟後直接拖曳即可平移；也可按住 Alt 或滑鼠中鍵拖曳、雙指一起移動">平移模式</button><button id="reset">重設視角</button><button id="png">匯出 PNG</button><div class="locks"><label class="chk lkl"><input type="checkbox" id="lockY">鎖定 Y 軸（左右旋轉）</label><label class="chk lkl"><input type="checkbox" id="lockX">鎖定 X 軸（上下傾斜）</label><label class="chk lkl" title="Z 軸旋轉：Shift＋拖曳、滑鼠右鍵拖曳，或雙指扭轉"><input type="checkbox" id="lockZ">鎖定 Z 軸（畫面旋轉）</label></div></div></div></details>
    <details class="pn" open><summary>圖層</summary><div class="pb"><div id="lylist"></div><div class="row"><button id="ltop">置頂</button><button id="lbot">置底</button></div></div></details>
    <details class="pn" open><summary>屬性</summary><div class="pb" id="props"></div></details>
    <details class="pn" open><summary>杯子尺寸（mm）</summary><div class="pb">
    <div class="g" style="margin-top:8px">
      <label>杯口外徑<input type="number" id="top" value="90" step="0.5"></label>
      <label>杯底外徑<input type="number" id="bot" value="60" step="0.5"></label>
      <label>杯身高度<input type="number" id="h" value="95" step="0.5"></label>
    </div>
    <div class="g2">
      <label>杯底留白（mm）<input type="number" id="safe" value="4" step="0.5"></label>
      <label>杯身底色<input type="color" id="bg" value="#ffffff"></label>
    </div>
    <div class="g2">
      <label>封邊（黏貼）寬度 (mm)<input type="number" id="ov" value="6" step="0.5" min="0"></label>
      <label>封邊位置<select id="ovs"><option value="R">右側</option><option value="L">左側</option></select></label>
    </div>
    <div class="g2">
      <label>出血 (mm)<input type="number" id="bl" value="3" step="0.5" min="0"></label>
    </div>
  </div></details>
    <textarea id="ta" readonly></textarea>
  </aside>
</div>
<footer class="sb"><span>拖曳移動 · 8 控制點縮放（Shift 反轉比例）· 方向鍵微調 · 文字：按 T 再點畫面輸入，雙擊文字直接編輯（Enter 換行、Esc 結束）</span> ｜ <span id="info"></span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const FONTS=[["黑體","Noto Sans TC, sans-serif"],["明體","Noto Serif TC, serif"],["Arial","Arial, sans-serif"],["Georgia","Georgia, serif"],["Courier","Courier New, monospace"]];
let objs=[
 {type:"t",t:"COFFEE",f:FONTS[0][1],s:14,sx:1,y:48,dx:0,ls:1,c:"#7c2d12",b:true,lock:true},
 {type:"t",t:"手沖咖啡 · 每日現磨",f:FONTS[0][1],s:6,sx:1,y:34,dx:0,ls:1,c:"#1c1c1a",b:false,lock:true}
];
let ed=null,editing=null,tool=null,lastO=null,lastT=0;
let sel=null,drag=null,raf=0,T=null,texTimer=0,tok=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const n=id=>parseFloat($(id).value)||0;
const f2=v=>+v.toFixed(3);

/* ---------- 幾何 ---------- */
function geo(){
  const top=n("top"),bot=Math.min(n("bot"),top-0.1),h=n("h");
  const L=Math.hypot(h,(top-bot)/2);
  const Rt=L*top/(top-bot),Rb=Rt-L,a0=Math.PI*top/Rt,ao=Math.max(0,n("ov"))/Rt,a=a0+ao;
  const fs=$("ovs").value==="R"?-ao/2:ao/2;
  const half=a/2,bl=Math.max(0,n("bl")),Ro=Rt+bl,Ri=Math.max(0.1,Rb-bl);
  const ho=half+Math.asin(Math.min(1,bl/Ro)),hI=half+Math.asin(Math.min(1,bl/Ri));
  const xs=Math.max(Ro*Math.sin(Math.min(ho,Math.PI/2)),Ri*Math.sin(Math.min(hI,Math.PI/2)));
  const y1=Math.max(-Ri*Math.cos(hI),-Ro*Math.cos(ho));
  return{L,Rt,Rb,a,top,a0,ao,fs,bx:{x:-xs,y:-Ro,w:2*xs,h:y1+Ro,bl,Ro,Ri,ho,hi:hI}};
}
/* 文字逐字定位：sx＝水平拉伸倍率 */
const mctx=document.createElement("canvas").getContext("2d");
function ax(o,W){return o.al==="l"?0:o.al==="r"?W:W/2;}
function glyphs(l){
  const lines=String(l.t).split("\n"),n=lines.length,kx=l.sx||1,lh=l.lh||1.2,al=l.al||"c",out=[];
  if(l.v){/* 直書：多行＝多欄，由右向左；al＝欄內 l上/c中/r下 */
    const ky=l.sy||1,adv=(l.s+l.ls)*ky,pitch=lh*l.s*kx,W=l.s*kx+(n-1)*pitch;
    const Hs=lines.map(t=>Math.max(0,[...t].length*adv-l.ls*ky)),H=Math.max(...Hs,0);
    lines.forEach((t,j)=>{const cx=l.dx+W/2-l.s*kx/2-j*pitch;
      const top=al==="l"?l.y+H/2:al==="r"?l.y-H/2+Hs[j]:l.y+Hs[j]/2;
      [...t].forEach((c,i)=>out.push({c,x:cx,yb:top-l.s*ky/2-i*adv-.3*l.s*ky}));});
    return{out,tot:W,H};
  }
  mctx.font=(l.b?700:400)+" "+l.s+"px "+l.f;
  const ls=l.ls*kx,data=lines.map(t=>{const cs=[...t],ws=cs.map(c=>mctx.measureText(c).width*kx);return{cs,ws,tot:ws.reduce((p,w)=>p+w,0)+ls*Math.max(0,cs.length-1)};});
  const W=Math.max(...data.map(d=>d.tot),0),L0=l.dx-ax(l,W);
  data.forEach((d,j)=>{let x=al==="l"?L0:al==="r"?L0+W-d.tot:L0+(W-d.tot)/2;
    d.cs.forEach((c,i)=>{out.push({c,w:d.ws[i],x:x+d.ws[i]/2,yb:l.y-j*lh*l.s});x+=d.ws[i]+ls;});});
  return{out,tot:W,H:0};
}
function bbox(o){
  if(o.type==="t"&&o.v){const g=glyphs(o);return{x:o.dx-g.tot/2,y:-o.y-g.H/2,w:Math.max(g.tot,1),h:Math.max(g.H,1)};}
  if(o.type==="t"){const g=glyphs(o),n=String(o.t).split("\n").length,W=Math.max(g.tot,1);return{x:o.dx-ax(o,W),y:-o.y-.85*o.s,w:W,h:1.1*o.s+(n-1)*(o.lh||1.2)*o.s};}
  return{x:o.dx-o.w/2,y:-o.y-o.h/2,w:o.w,h:o.h};
}
function applyBox(o,nb){
  if(o.type==="i"){o.w=+nb.w.toFixed(2);o.h=+nb.h.toFixed(2);o.dx=+(nb.x+nb.w/2).toFixed(2);o.y=+(-nb.y-nb.h/2).toFixed(2);return;}
  const L=String(o.t).split("\n"),n=L.length,lh=o.lh||1.2;
  if(o.v){const m=Math.max(...L.map(t=>[...t].length),1);
    o.s=+Math.max(.5,nb.w/((o.sx||1)*(1+(n-1)*lh))).toFixed(2);
    o.sy=+Math.max(.05,nb.h/((m*o.s+(m-1)*o.ls)||1)).toFixed(3);
    o.dx=+(nb.x+nb.w/2).toFixed(2);o.y=+(-nb.y-nb.h/2).toFixed(2);return;}
  o.s=+Math.max(.5,nb.h/(1.1+(n-1)*lh)).toFixed(2);o.sx=1;
  o.sx=+Math.max(.05,nb.w/(glyphs(o).tot||1)).toFixed(3);
  o.dx=+(nb.x+ax(o,nb.w)).toFixed(2);o.y=+(-nb.y-.85*o.s).toFixed(2);
}
function centerAt(o,cx,cy){o.dx=0;o.y=0;const b=bbox(o);o.dx=+(cx-b.x-b.w/2).toFixed(2);o.y=+(b.y+b.h/2-cy).toFixed(2);}

/* ---------- 扇形輸出 SVG ---------- */
function build(wg,bgc,hi){
  const g=geo(),{L,Rt,Rb,a,a0,ao,fs,bx:B}=g,half=a/2,pad=8,large=a>Math.PI?1:0,xs=-B.x,rcx=Rb+L/2;
  const P=(r,t)=>f2(r*Math.sin(t))+" "+f2(-r*Math.cos(t));
  const vw=2*xs+2*pad,vh=B.h+2*pad;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f2(vw)}mm" height="${f2(vh)}mm" viewBox="${f2(-xs-pad)} ${f2(B.y-pad)} ${f2(vw)} ${f2(vh)}">`;

const imgSig=(im,k)=>{const g=geo();return [g.Rt,g.Rb,g.a,g.fs,g.bx.bl,im.w,im.h,im.y,im.dx,k].join();};
function warpCanvas(im,k){
  const sig=imgSig(im,k);im.c=im.c||{};
  if(im.c[k]&&im.c[k].sig===sig)return im.c[k].cv;
  const{Rt,Rb,L,a,fs,bx}=geo(),half=a/2,vx0=bx.x,vy0=bx.y,vw=bx.w,vh=bx.h,bl=bx.bl;

  if(!(im.w>.1&&im.h>.1)){im.c[k]={sig,cv};return cv;}
  const ctx=cv.getContext("2d"),out=ctx.createImageData(cw,ch),o=out.data;
  const sw=Math.max(2,Math.min(im.img.naturalWidth,Math.ceil(im.w*k))),sh=Math.max(2,Math.min(im.img.naturalHeight,Math.ceil(im.h*k)));

  const sx=sc.getContext("2d");sx.imageSmoothingQuality="high";sx.drawImage(im.img,0,0,sw,sh);

  for(let py=0;py<ch;py++){const Y=vy0+(py+.5)/k;

      const phi=Math.atan2(X,-Y),lim=half+Math.asin(Math.min(1,bl/r));if(phi<-lim||phi>lim)continue;
      const u=((phi-fs)*rcx-im.dx+im.w/2)/im.w,v=(rcy+im.h/2-r)/im.h;
      if(u<0||u>1||v<0||v>1)continue;
      const fx=Math.min(sw-1,Math.max(0,u*sw-.5)),fy=Math.min(sh-1,Math.max(0,v*sh-.5));
      const x0=fx|0,y0=fy|0,x1=Math.min(sw-1,x0+1),y1=Math.min(sh-1,y0+1),tx=fx-x0,ty=fy-y0,i=(py*cw+px)*4;
      for(let c=0;c<4;c++){
        const p00=s[(y0*sw+x0)*4+c],p10=s[(y0*sw+x1)*4+c],p01=s[(y1*sw+x0)*4+c],p11=s[(y1*sw+x1)*4+c];

}

  if(ao>1e-6){const right=fs<0,m=(a0/2)*rc,x0=right?m:u0,x1=right?u1:-m;
    s+=`<rect x="${f2(x0)}" y="${f2(-L)}" width="${f2(x1-x0)}" height="${f2(L)}" fill="#f59e0b" fill-opacity="0.18" stroke="none"/><path stroke="#f59e0b" stroke-dasharray="${d}" d="M ${f2(right?m:-m)} ${f2(-L)} V 0"/>`;}

function schedule3d(){if(!T)return;clearTimeout(texTimer);texTimer=setTimeout(update3d,drag?400:150);}
function ensure3d(){
  if(T)return;
  if(!window.THREE){$("v3c").textContent="3D 函式庫載入失敗";return;}
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  $("v3c").appendChild(renderer.domElement);
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,1,3000);
  scene.add(new THREE.AmbientLight(0xffffff,.8));
  const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(60,120,200);scene.add(dl);
  const group=new THREE.Group();group.rotation.order="YXZ";scene.add(group);
  const ocam=new THREE.OrthographicCamera(-1,1,1,-1,1,3000);
  T={renderer,scene,camera,ocam,front:false,group,auto:true,yaw:0,pitch:.25,roll:0,panX:0,panY:0,panMode:false,zoom:1,dist:300,parts:[]};
  const el=renderer.domElement;let dr=null,tw=null,pm=null;const ptr=new Map();
  const two=()=>{const[a,b]=[...ptr.values()];return{ang:Math.atan2(b.y-a.y,b.x-a.x),x:(a.x+b.x)/2,y:(a.y+b.y)/2};};
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("pointerdown",e=>{
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});dr=[e.clientX,e.clientY];
    if(ptr.size===2){const t=two();tw=t.ang;pm=[t.x,t.y];}
    if(!T.lockY){T.auto=false;$("auto").textContent="自動旋轉";}
    el.setPointerCapture(e.pointerId);if(e.button===1)e.preventDefault();});
  el.addEventListener("pointermove",e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const lh=T.lh||300;
    if(ptr.size>=2){/* 雙指：扭轉＝Z 軸旋轉，一起移動＝平移 */const t=two();
      if(tw!==null&&!T.lockZ&&!T.front)T.roll+=t.ang-tw;
      if(pm){T.panX+=(t.x-pm[0])/lh;T.panY+=(t.y-pm[1])/lh;}
      tw=t.ang;pm=[t.x,t.y];return;}
    if(!dr)return;const dx=e.clientX-dr[0],dy=e.clientY-dr[1];
    if(T.panMode||e.altKey||(e.buttons&4)){T.panX+=dx/lh;T.panY+=dy/lh;}
    else if(e.shiftKey||(e.buttons&2)){if(!T.lockZ&&!T.front)T.roll+=dx*.01;}
    else{if(!T.lockY)T.yaw+=dx*.01;
      if(e.pointerType==="mouse"&&!T.lockX&&!T.front)T.pitch=Math.max(-.3,Math.min(1,T.pitch+dy*.01));}
    dr=[e.clientX,e.clientY];});
  const up=e=>{ptr.delete(e.pointerId);tw=null;pm=null;if(!ptr.size)dr=null;else{const v=[...ptr.values()][0];dr=[v.x,v.y];}};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  el.addEventListener("wheel",e=>{e.preventDefault();T.zoom=Math.max(.4,Math.min(2.5,T.zoom*(e.deltaY>0?1.08:.92)));},{passive:false});
}

function fitOrtho(asp){const o=T.ocam,hv=T.dist/3.2*.62;

async function update3d(){
  if(!T)return;const my=++tok;
  const{Rb,L,a0,fs,bx}=geo(),top=n("top"),bot=Math.min(n("bot"),top-0.1),h=n("h");
  const vx0=bx.x,vy0=bx.y,vw=bx.w,vh=bx.h;
  const k=Math.min(8,2048/Math.max(vw,vh));
  const cv=document.createElement("canvas");cv.width=Math.ceil(vw*k);cv.height=Math.ceil(vh*k);
  const ctx=cv.getContext("2d");
  ctx.fillStyle=$("bg").value;ctx.fillRect(0,0,cv.width,cv.height);
  await Promise.all(objs.filter(o=>o.type==="t").map(l=>document.fonts.load((l.b?700:400)+" 20px "+l.f,l.t).catch(()=>{})));
  if(my!==tok)return;
  ctx.textBaseline="alphabetic";ctx.textAlign="center";
  const rcx=Rb+L/2;
  for(const l of objs){
    if(l.on===false)continue;
    if(l.type==="i"){try{ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(warpCanvas(l,k),0,0);}catch(e){}continue;}
    ctx.setTransform(k,0,0,k,-k*vx0,-k*vy0);
    ctx.font=(l.b?700:400)+" "+l.s+"px "+l.f;ctx.fillStyle=l.c;
    const sy=l.v?(l.sy||1):1;
    glyphs(l).out.forEach(q=>{if(!q.c.trim())return;const r=Rb+q.yb,t=fs+q.x/rcx;
      ctx.save();ctx.translate(r*Math.sin(t),-r*Math.cos(t));ctx.rotate(t);ctx.scale(r/rcx*(l.sx||1),sy);ctx.fillText(q.c,0,0);ctx.restore();});
  }
  const N=128,M=10,P=[],UV=[],I=[],tr=top/2,br=bot/2;
  for(let j=0;j<=M;j++){const q=j/M,r=Rb+L*q,rho=br+(tr-br)*q,y=-h/2+h*q;
    for(let i=0;i<=N;i++){const p=fs-a0/2+a0*i/N,psi=(p-fs)/(a0/2)*Math.PI;
      P.push(rho*Math.sin(psi),y,rho*Math.cos(psi));
      UV.push((r*Math.sin(p)-vx0)/vw,1-(-r*Math.cos(p)-vy0)/vh);}}
  for(let j=0;j<M;j++)for(let i=0;i<N;i++){const A=j*(N+1)+i,B=A+1,C=A+N+1,D=C+1;I.push(A,B,C,B,D,C);}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(P,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute(UV,2));
  g.setIndex(I);g.computeVertexNormals();
  const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=T.renderer.capabilities.getMaxAnisotropy();
  const outer=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:tex,roughness:.75,side:THREE.FrontSide}));
  const inner=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xf1ede6,roughness:.9,side:THREE.BackSide}));
  const cap=new THREE.Mesh(new THREE.CircleGeometry(br,48).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:$("bg").value,side:THREE.DoubleSide}));cap.position.y=-h/2;
  const rim=new THREE.Mesh(new THREE.TorusGeometry(tr,Math.max(.6,h*.01),8,72).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0xf4f4f2,roughness:.6}));rim.position.y=h/2;
  T.parts.forEach(m=>{T.group.remove(m);m.geometry.dispose();m.material.map&&m.material.map.dispose();m.material.dispose();});
  T.parts=[outer,inner,cap,rim];T.parts.forEach(m=>T.group.add(m));
  T.dist=Math.max(h,top)*3.2;
}
