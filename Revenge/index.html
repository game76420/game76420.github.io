<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rodent's Revenge</title>
<style>
:root{--face:#c0c0c0;--black:#000;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans CJK TC",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;background:var(--face);box-shadow:0 0 0 1px #555;touch-action:none;}
#game{display:block;image-rendering:auto;background:var(--face);}
#menu{position:absolute;left:0;top:0;height:32px;display:flex;align-items:stretch;background:var(--face);z-index:20;color:#000;font-size:13px}
.menuRoot{position:relative;padding:7px 10px 5px;cursor:pointer;white-space:nowrap}
.menuRoot:hover,.menuRoot.open{background:#000080;color:#fff}
.dropdown{display:none;position:absolute;left:0;top:100%;min-width:190px;background:var(--face);color:#000;border:1px solid #555;box-shadow:2px 2px 0 #000;z-index:50;padding:2px}
.menuRoot.open .dropdown{display:block}
.item{padding:5px 9px;white-space:nowrap;display:flex;justify-content:space-between;gap:22px;cursor:pointer}
.item:hover{background:#000080;color:#fff}.sep{height:1px;background:#808080;border-top:1px solid #fff;margin:3px 0}
.check::before{content:'○';display:inline-block;width:18px}.checked::before{content:'●'}
#joystick{display:none;position:absolute;width:124px;height:124px;border-radius:50%;background:rgba(192,192,192,.62);border:2px solid rgba(0,0,0,.35);z-index:30;touch-action:none;user-select:none}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(80,80,80,.62);border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 5px #333}
#modalShade{display:none;position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:80}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--face);border:2px solid #fff;box-shadow:2px 2px 0 #000;min-width:300px;color:#000;padding:14px}
.dialog h2{font-size:17px;margin:0 0 12px}.dialog p{white-space:pre-line;font-size:13px;line-height:1.45;margin:7px 0}.dialog button{font:13px inherit;padding:7px 16px;margin:6px 4px 0 0;border:2px solid #fff;background:var(--face);box-shadow:1px 1px 0 #000;cursor:pointer}.dialog button:active{box-shadow:inset 1px 1px #000}
#scores{width:min(490px,92vw);height:min(445px,86vh);overflow:auto}.scoreBox{border:1px solid #808080;margin:10px 0 18px;padding:10px;background:#c0c0c0;box-shadow:inset 1px 1px #fff}.scoreTitle{text-align:center;font-weight:bold;font-size:16px;margin:-2px auto 8px}.scoreRow{display:grid;grid-template-columns:36px 1fr 90px;font:12px monospace;line-height:1.55}.scoreActions{text-align:right}
#touchHint{display:none;position:absolute;right:8px;bottom:8px;color:#333;font-size:11px;z-index:25;pointer-events:none}
@media (pointer:coarse){#joystick{display:block}#touchHint{display:block}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="menu">
      <div class="menuRoot" data-menu="game">遊戲<div class="dropdown">
        <div class="item" id="newGame">新遊戲 <span>F2</span></div>
        <div class="item" id="pauseGame">暫停 <span>F3</span></div>
        <div class="item" id="highScores">排行榜...</div><div class="sep"></div>
        <div class="item" id="exitGame">離開</div>
      </div></div>
      <div class="menuRoot" data-menu="options">選項<div class="dropdown">
        <div class="item" id="levelSelect">關卡...</div><div class="sep"></div>
        <div class="item check" data-size="0">小尺寸</div><div class="item check" data-size="1">大尺寸</div><div class="sep"></div>
        <div class="item check" data-speed="0">蝸牛</div><div class="item check" data-speed="1">慢速</div><div class="item check" data-speed="2">中速</div><div class="item check" data-speed="3">快速</div><div class="item check" data-speed="4">極速</div>
      </div></div>
      <div class="menuRoot" data-menu="help">說明<div class="dropdown">
        <div class="item" data-help="Index">索引</div><div class="item" data-help="How to Play">遊戲說明</div><div class="item" data-help="Commands">操作方式</div><div class="item" data-help="Using Help">使用說明</div><div class="sep"></div><div class="item" id="about">關於 Rodent's Revenge...</div>
      </div></div>
    </div>
    <canvas id="game"></canvas>
    <div id="joystick"><div id="joyKnob"></div></div><div id="touchHint">拖曳圓形搖桿控制方向</div>
    <div id="modalShade"></div>
  </div>
</div>
<script>
'use strict';
const FIELD=23,LAST=22,MID=11,SMALL=12,LARGE=16;
const CH={OPEN:0,BLOCK:1,WALL:2,VERT:3,HORZ:4,HOLE:5,TRAP:6,CHEESE:7,HOLEGUY:8,KAT:16,YARN:17,YARN_LAST:20,GUYGREY:21,GREY:22,KATSLEEP:23,GUY:32,DEAD:37};
const TYPE={KAT:0,YARN:1}, BAD_MAX=20;
const MODE={DEMO1:1,BEGINGAME:2,BEGINLEVEL:3,RESTART:4,BEGINN:5,PLAY:6,PLAY_FAST:7,YARN:8,DYING:9,ENDN:10,ENDLEVEL:11,ENDGAME:12};
const MP_TIME=[2000,1000,500,275,180], LVL_MIN=[5,4,5,2,3,4], LVL_CK=[3,3,6,2,4,4], LVL_DK=[3,3,4,2,3,3], LVL_PERY=[100,90,87,100,50,50];
const MODE_TIME={[MODE.DEMO1]:500,[MODE.BEGINGAME]:100,[MODE.BEGINLEVEL]:100,[MODE.BEGINN]:100,[MODE.PLAY_FAST]:50,[MODE.YARN]:50,[MODE.DYING]:100,[MODE.ENDLEVEL]:100,[MODE.ENDGAME]:100};
const DX=[0,1,1,1,0,-1,-1,-1],DY=[-1,-1,0,1,1,1,0,-1],KEYPAD=[5,4,3,6,-1,2,7,0,1];
const assetSmall='assets/original/rcdata_5_bm_01_108x36.bmp',assetLarge='assets/original/rcdata_5_bm_03_144x48.bmp',assetClock='assets/original/rcdata_2_bm_01_32x32.bmp',assetTrophy='assets/original/weputil_trophies.png';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let artSmall=new Image(),artLarge=new Image(),artClock=new Image(),artTrophy=new Image();
artSmall.src=assetSmall;artLarge.src=assetLarge;artClock.src=assetClock;artTrophy.src=assetTrophy;
const field=Array.from({length:FIELD},()=>Array(FIELD).fill(CH.OPEN));
let items=[];
class VBRng{constructor(){this.state=0;this.randomizeTimer()}randomizeTimer(){let sec=Date.now()/1000;let f=new Float32Array([sec]);let u=new Uint32Array(f.buffer)[0];this.state=(((u&65535)<<8)^((u>>8)&0xffff00))|(this.state&0xff0000ff)}rnd(){let v=this.state;v=(0xffc39ec3-(v*0x2bc03))&0xffffff;this.state=v;return v/16777216}myrand(n){if(n<=0)return 0;return Math.min(Math.floor(n*this.rnd()),n-1)}}
const rng=new VBRng();
const G={sizeIndex:0,cell:12,fieldPx:276,fldTop:36,speedIndex:1,timeBase:1000,levelStart:0,level:0,lvl6:0,score:0,lives:3,cmin:0,csec:0,timeG:1000,mode:MODE.DEMO1,cmoves:0,modYarn:0,stun:0,ibadYarn:0,dirYarn:0,fDoMelt:false,bad:[],subscore:0,paused:false,todayScores:[],mouse:{x:11,y:11,ch:CH.GUY},ctype:[0,0],timer:null,clock:0};
function sprite(ch){let cell=G.cell,img=cell===12?artSmall:artLarge;let sx=(ch&15)*cell,sy=(ch>>4)*cell;return {img,sx,sy,cell}}
function drawSprite(ch,x,y){let s=sprite(ch);ctx.drawImage(s.img,s.sx,s.sy,s.cell,s.cell,x*G.cell,G.fldTop+y*G.cell,G.cell,G.cell)}
function drawSpriteAt(ch,px,py){let s=sprite(ch);ctx.drawImage(s.img,s.sx,s.sy,s.cell,s.cell,px,py,s.cell,s.cell)}
function setTile(x,y,ch){if(x>=0&&y>=0&&x<23&&y<23)field[y][x]=ch}function fldGet(x,y){return x<0||y<0||x>=23||y>=23?CH.OPEN:field[y][x]}function fldDraw(x,y,ch){setTile(x,y,ch)}function fldErase(ch){for(let y=0;y<23;y++)field[y].fill(ch)}
function layout(){G.cell=G.sizeIndex?16:12;G.fieldPx=23*G.cell;G.fldTop=Math.max(32,G.cell)+4;canvas.width=G.fieldPx;canvas.height=G.fldTop+G.fieldPx;stageSize()}
function stageSize(){let menuH=32;let maxW=innerWidth,maxH=innerHeight;let scale=Math.min(maxW/canvas.width,maxH/canvas.height);let stage=document.getElementById('stage');stage.style.width=(canvas.width*scale)+'px';stage.style.height=(canvas.height*scale)+'px';canvas.style.width='100%';canvas.style.height='100%';document.getElementById('menu').style.transform=`scale(${scale})`;document.getElementById('menu').style.transformOrigin='top left';document.getElementById('menu').style.width=canvas.width+'px';document.getElementById('menu').style.height='32px';let joy=document.getElementById('joystick');joy.style.left=(8*scale)+'px';joy.style.bottom=(8*scale)+'px';joy.style.transform=`scale(${scale})`;joy.style.transformOrigin='bottom left';document.getElementById('touchHint').style.transform=`scale(${1/Math.max(scale,.01)})`;document.getElementById('touchHint').style.transformOrigin='bottom right'}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#c0c0c0';ctx.fillRect(0,0,canvas.width,canvas.height);let gy=(G.fldTop-G.cell)/2;for(let i=0;i<5;i++)drawSpriteAt(i<Math.max(0,G.lives-1)?CH.GUYGREY:CH.GREY,G.cell+i*G.cell,gy);if(artClock.complete)ctx.drawImage(artClock,0,0,32,32,(G.fieldPx-32)/2,2,32,32);drawClock((G.fieldPx-32)/2,2);ctx.fillStyle='#000';ctx.font='bold 8px "Microsoft JhengHei UI","Noto Sans CJK TC",sans-serif';ctx.textAlign='right';ctx.fillText(G.score.toLocaleString('en-US'),G.fieldPx-2,(G.fldTop-8)/2+5);ctx.strokeStyle='#000';ctx.beginPath();ctx.moveTo(1,G.fldTop-2);ctx.lineTo(G.fieldPx-2,G.fldTop-2);ctx.moveTo(1,1);ctx.lineTo(G.fieldPx-2,1);ctx.stroke();for(let y=0;y<23;y++)for(let x=0;x<23;x++)drawSprite(field[y][x],x,y);drawBanners()}
function drawClock(x,y){let csec=G.csec/30,cm=Math.min(1,(G.cmin+csec/4)/30),lv=2*Math.PI*(G.level+1+cm/2)/12,s=csec*2*Math.PI,m=cm*2*Math.PI,cx=x+15,cy=y+17;function ep(L,a){return[cx-L*Math.sin(2*Math.PI-a),cy-L*Math.cos(2*Math.PI-a)]}[[10,s,'#f00'],[10,m,'#000080'],[6,lv,'#000']].forEach(([L,a,c])=>{let[e1,e2]=ep(L,a);ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(e1,e2);ctx.stroke()});let mm=2*Math.PI*(G.cmin-(G.cmin%LVL_MIN[G.lvl6])+LVL_MIN[G.lvl6])/30;mm=mm>5.23598775598299?2*Math.PI:mm;let ss=Math.sin(2*Math.PI-mm),cc=Math.cos(2*Math.PI-mm),x1=cx-8.5*ss,y1=cy-8.5*cc;ctx.strokeStyle='#ff0000';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-4*ss,y1-4*cc);ctx.stroke()}
function drawBanners(){if(G.mode===MODE.ENDGAME)banner(' 遊戲結束 ',true);else if(G.paused){banner(' 暫停。 ',true);banner(' 按 F3 繼續。 ',false)}}
function banner(t,large){ctx.font=(large?'bold 18px ':'bold 8px ')+'"Microsoft JhengHei UI","Noto Sans CJK TC",sans-serif';let w=ctx.measureText(t).width+4,h=(large?21:11),x=(G.fieldPx-w)/2,y=(G.fieldPx-h)/4;if(!large){let fh=23; y=(G.fieldPx-fh)/4+fh*1.5}ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.fillStyle='#000';ctx.textAlign='left';ctx.fillText(t,x+2,y+(large?17:9))}
function schedule(ms){clearTimeout(G.timer);G.timer=setTimeout(tick,ms==null?G.timeG:ms)}
function modeSet(n){clearTimeout(G.timer);if(n===MODE.DEMO1){G.level=G.levelStart;G.score=0;G.cmin=G.csec=0;G.lives=3;G.bad=[];G.ibadYarn=0;G.paused=false;levelNew(G.level);guyPaint();render()}else if(n===MODE.BEGINGAME){G.lives=3;G.score=0;G.level=G.levelStart-1;G.bad=[];G.cmin=G.csec=0;G.mode=MODE.BEGINGAME;schedule(100);return}else if(n===MODE.BEGINLEVEL){levelNew(-1);timeReset();G.bad=[];G.ibadYarn=0;guyNew(0);G.mode=MODE.BEGINN;schedule(100);return}else if(n===MODE.RESTART){G.csec=0;G.cmin=Math.max(0,G.cmin-(G.cmin%LVL_MIN[G.lvl6]));guyNew(-1);G.ibadYarn=0;G.stun=0}else if(n===MODE.PLAY)setTimer();else if(n===MODE.ENDGAME){G.fDoMelt=false;G.paused=false;render();highScoreOffer();}G.mode=n;G.timeG=MODE_TIME[n]||G.timeG;if(n===MODE.DEMO1)G.timeG=500;render();if(n!==MODE.ENDGAME)schedule()}
function levelNew(lvl){fldErase(CH.OPEN);G.level=lvl>=0?lvl:G.level+1;G.lvl6=G.level%6;levelDraw();render()}
function levelDraw(){let perY=LVL_PERY[G.lvl6],perB=100-perY,perH=0,perT=0;if(G.level>=3){perH=Math.min(15,2*(G.level+G.lvl6-4));perY=Math.max(0,perY-perH)}if(G.level>=6){perT=Math.min(10,G.level+G.lvl6-5);perB=Math.max(0,perB-perT)}if(perY<perB-15){let i=perB+perY;perY=Math.floor(i/2)-7;perB=perY+15}for(let i=0;i<23;i++){fldDraw(i,0,CH.WALL);fldDraw(i,22,CH.WALL);fldDraw(0,i,CH.WALL);fldDraw(22,i,CH.WALL)}let cblock=200-5*G.level-5*G.lvl6;if(cblock*perY<7000)cblock=perY?Math.floor(7000/perY):0;if(G.lvl6===0||G.lvl6===1){let r=Math.floor(Math.sqrt(cblock))/2|0;for(let x=11-r;x<12+r;x++)for(let y=11-r;y<12+r;y++)fldDraw(x,y,CH.BLOCK)}else if(G.lvl6===3){let r=Math.floor(Math.sqrt(2*cblock))/2|0;for(let x=11-r;x<12+r;x++)for(let y=11-r;y<12+r;y++)if((x+y)&1)fldDraw(x,y,CH.BLOCK)}if(G.lvl6===5){let r=Math.floor(Math.sqrt(2*perB*cblock/100))/2|0;for(let x=11-r;x<12+r;x++)for(let y=11-r;y<12+r;y++)if(((x+y)&1)===1)fldDraw(x,y,CH.WALL)}else for(let i=0;i<cblock*perB/100;i++)fldDraw(1+rng.myrand(20),1+rng.myrand(20),CH.WALL);for(let i=0;i<cblock*perH/100;i++)fldDraw(1+rng.myrand(20),1+rng.myrand(20),CH.HOLE);for(let i=0;i<cblock*perT/100;i++)fldDraw(1+rng.myrand(20),1+rng.myrand(20),CH.TRAP);if([2,4,5].includes(G.lvl6))for(let i=0;i<cblock*perY/100+1;i++)fldDraw(1+rng.myrand(20),1+rng.myrand(20),CH.BLOCK)}
function guyNew(frand){let d=50,x=11,y=11;if(frand){while(true){let ok=true;for(const b of G.bad)if((b.x-x)**2+(b.y-y)**2<d){ok=false;break}if(ok)break;x=1+rng.myrand(21);y=1+rng.myrand(21);d--}}G.bad=G.bad.filter(b=>b.type!==999);G.mouse={x,y,ch:CH.GUY};fldDraw(x,y,CH.GUY);for(const b of G.bad)fldDraw(b.x,b.y,b.ch);render()}
function guyPaint(){render()}function guyKill(){G.lives--;render();modeSet(G.lives<=0?MODE.ENDGAME:MODE.RESTART)}
function guyMove(d){if(d<0||G.stun)return;let x=G.mouse.x+DX[d],y=G.mouse.y+DY[d],ch=fldGet(x,y);if(ch===CH.BLOCK){if(pushBlock(CH.BLOCK,x,y,DX[d],DY[d])){fldDraw(G.mouse.x,G.mouse.y,CH.OPEN);G.mouse={...G.mouse,x,y};fldDraw(x,y,CH.GUY)}}else if(ch===CH.TRAP){fldDraw(G.mouse.x,G.mouse.y,CH.OPEN);G.mouse={...G.mouse,x,y};fldDraw(x,y,CH.GUY);modeSet(MODE.DYING)}else if(ch===CH.HOLE){G.stun=10;fldDraw(G.mouse.x,G.mouse.y,CH.OPEN);G.mouse={...G.mouse,x,y};fldDraw(x,y,CH.HOLEGUY)}else if(ch===CH.CHEESE){scoreAdd(100+25*G.level);fldDraw(G.mouse.x,G.mouse.y,CH.OPEN);G.mouse={...G.mouse,x,y};fldDraw(x,y,CH.GUY)}else if(ch===CH.OPEN){fldDraw(G.mouse.x,G.mouse.y,CH.OPEN);G.mouse={...G.mouse,x,y};fldDraw(x,y,CH.GUY)}render()}
function findBad(x,y){return G.bad.findIndex(b=>b.x===x&&b.y===y)}function pushBlock(chdraw,x,y,dx,dy){while(true){x+=dx;y+=dy;let ch=fldGet(x,y);if(ch===CH.OPEN){fldDraw(x,y,chdraw);return true}if(ch===CH.HOLE){if(chdraw!==CH.BLOCK)fldDraw(x,y,chdraw);return true}if(ch===CH.CHEESE){fldDraw(x,y,chdraw);return true}if(ch===CH.KAT){let i=findBad(x,y);if(i<0)return false;if(!badMoveKat(i))continue;let f=pushBlock(CH.KAT,x,y,dx,dy);if(f){fldDraw(x,y,chdraw);G.bad[i].x+=dx;G.bad[i].y+=dy}return f}if(ch===CH.BLOCK){if(chdraw!==CH.BLOCK){let f=pushBlock(CH.BLOCK,x,y,dx,dy);if(f)fldDraw(x,y,chdraw);return f}continue}return false}}
function badFopen(x,y){return [CH.GUY,CH.HOLEGUY,CH.OPEN,CH.CHEESE].includes(fldGet(x,y))}function badKill(i){G.bad.splice(i,1)}
function badNew(count,typ){G.ctype[typ]+=count;if(G.ctype[typ]<2)return;count=Math.floor(G.ctype[typ]/2);G.ctype[typ]-=2*count;if(count+G.bad.length>BAD_MAX)return;if(typ===TYPE.KAT){for(let q=0;q<count;q++){let x,y;do{x=rng.myrand(23);y=rng.myrand(23)}while(fldGet(x,y)!==CH.OPEN||(x-G.mouse.x)**2+(y-G.mouse.y)**2<100);G.bad.push({x,y,ch:CH.KAT,type:TYPE.KAT,wp:0});fldDraw(x,y,CH.KAT)}}else{if(G.bad.length+count>BAD_MAX-3)return;for(let q=0;q<count;q++){let wp=G.level-2>0?rng.myrand(Math.min(5,Math.max(0,G.level-2))):0,x=rng.myrand(23),y=rng.myrand(23),r=rng.rnd();if(r<.25)x=0;else if(r<.583333)x=22;else if(r<.791666)y=0;else y=22;G.bad.push({x,y,ch:CH.WALL,type:TYPE.YARN,wp});fldDraw(x,y,CH.WALL)}}}
function badMove(){if(G.stun){G.stun--;if(G.stun===0)fldDraw(G.mouse.x,G.mouse.y,CH.GUY)}if(G.csec===0&&G.cmin!==0&&G.cmin%LVL_MIN[G.lvl6]===0&&G.cmin<=25)badNew(LVL_DK[G.lvl6],TYPE.KAT);if(G.level>2&&rng.rnd()<1-Math.pow(.99,G.level))badNew(1,TYPE.YARN);let cant=0;for(let i=0;i<G.bad.length;i++){let b=G.bad[i];if(b.type===TYPE.YARN){cant++;badMoveYarn(i)}else{if(G.mode===MODE.YARN&&b.ch>=CH.YARN&&b.ch<=CH.YARN_LAST)continue;if(badMoveKat(i))cant++}}if(G.bad.length&&cant===G.bad.length){if(G.mode!==MODE.PLAY_FAST)G.mode=MODE.PLAY_FAST;for(let i=0;i<G.bad.length;){if(G.bad[i].type===TYPE.KAT){let b=G.bad[i];fldDraw(b.x,b.y,CH.CHEESE);badKill(i)}else i++}}}
function badMoveKat(i){let b=G.bad[i],x=b.x,y=b.y;if(rng.rnd()>=.1){let dx=(G.mouse.x>x)-(G.mouse.x<x),dy=(G.mouse.y>y)-(G.mouse.y<y);if(badFopen(x+dx,y+dy))return catOpen(i,x+dx,y+dy);if(rng.rnd()<.5&&badFopen(x,y+dy))return catOpen(i,x,y+dy);if(badFopen(x+dx,y))return catOpen(i,x+dx,y);if(badFopen(x,y+dy))return catOpen(i,x,y+dy)}let dirs=yarnFillDir(i,false);for(let q=0;q<8;q++)if(dirs.length){let d=dirs[rng.myrand(dirs.length)],dx=DX[d],dy=DY[d];if(badFopen(x+dx,y+dy)&&((dx!==0&&dx===((G.mouse.x>x)-(G.mouse.x<x)))||(dy!==0&&dy===((G.mouse.y>y)-(G.mouse.y<y)))))return catOpen(i,x+dx,y+dy)}let neigh=[];for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)neigh.push([dx,dy]);let a=rng.myrand(8),z=rng.myrand(8);[neigh[a],neigh[z]]=[neigh[z],neigh[a]];for(const [dx,dy] of neigh)if(badFopen(x+dx,y+dy))return catOpen(i,x+dx,y+dy);fldDraw(x,y,CH.KATSLEEP);return true}
function catOpen(i,x,y){let b=G.bad[i];fldDraw(b.x,b.y,CH.OPEN);b.x=x;b.y=y;if(x===G.mouse.x&&y===G.mouse.y){modeSet(MODE.DYING);return false}fldDraw(x,y,CH.KAT);return false}
function badMoveYarn(i){let b=G.bad[i];if(b.ch===CH.WALL){if(rng.rnd()<.1)b.ch=[CH.HORZ,CH.VERT][b.x===0||b.x===22?0:1]}else if(b.ch===CH.HORZ||b.ch===CH.VERT)b.ch=CH.YARN;else if(b.ch===CH.YARN){let d=yarnDirFire(i);if(d!==-1){G.dirYarn=d;G.ibadYarn=i;G.mode=MODE.YARN}}fldDraw(b.x,b.y,b.ch)}
function yarnMove(){let i=G.ibadYarn;if(i>=G.bad.length){modeSet(MODE.PLAY);return}let b=G.bad[i];if(b.ch>CH.YARN&&b.ch<=CH.YARN_LAST){if(b.ch===CH.YARN_LAST){let old=(b.x===0||b.x===22||b.y===0||b.y===22)?CH.WALL:CH.OPEN;fldDraw(b.x,b.y,old);badKill(i);G.ibadYarn=0;modeSet(MODE.PLAY);return}b.ch++;fldDraw(b.x,b.y,b.ch);return}let dx=DX[G.dirYarn],dy=DY[G.dirYarn],old=(b.x===0||b.x===22||b.y===0||b.y===22)?CH.WALL:CH.OPEN;fldDraw(b.x,b.y,old);b.x+=dx;b.y+=dy;let ch=fldGet(b.x,b.y);if(b.x<=0||b.y<=0||b.x>=22||b.y>=22)ch=CH.WALL;if(ch===CH.BLOCK||ch===CH.WALL){b.x-=dx;b.y-=dy;let under=fldGet(b.x,b.y);fldDraw(b.x,b.y,CH.YARN);let r=Math.min(.9,.05*G.level+.05*G.lvl6);if(rng.rnd()<r&&[CH.OPEN,CH.HOLE,CH.TRAP].includes(under)){G.ibadYarn=0;modeSet(MODE.PLAY);return}b.ch=CH.YARN+1}else if(ch===CH.GUY||ch===CH.HOLEGUY){fldDraw(b.x,b.y,CH.OPEN);badKill(i);G.ibadYarn=0;modeSet(MODE.DYING);return}fldDraw(b.x,b.y,b.ch)}
function yarnFillDir(i,diag){let b=G.bad[i],dirs=[];for(let d=0;d<8;d+=(diag?1:2)){let x=b.x+DX[d],y=b.y+DY[d];if(x>0&&x<22&&y>0&&y<22&&!([CH.BLOCK,CH.WALL].includes(fldGet(x,y))))dirs.push(d)}return dirs}
function yarnDirFire(i){if(G.ibadYarn)return -1;let b=G.bad[i];if(rng.rnd()<.075)return fireAny(i);let wp=b.wp;if(wp===1){if(Math.abs(b.y-G.mouse.y)<=1||Math.abs(b.x-G.mouse.x)<=1)return fireAny(i);return -1}if(wp===2&&rng.rnd()<.1){if(Math.abs(b.y-G.mouse.y)<=1||Math.abs(b.x-G.mouse.x)<=1)return fireAny(i);return -1}if(wp===3&&rng.rnd()>=.1)return onAxis(i);if(wp>=4){if(rng.rnd()<.05)return onAxis(i);if(rng.rnd()<.9)return onAxis(i);return fireAny(i)}return fireAny(i)}
function fireAny(i){let ds=yarnFillDir(i,G.level>3);if(ds.length){G.ibadYarn=i;G.mode=MODE.YARN;return ds[rng.myrand(ds.length)]}return -1}
function onAxis(i){let b=G.bad[i],mx=G.mouse.x,my=G.mouse.y,ds=yarnFillDir(i,false),ok=new Set(ds);if(b.y===my){let d=b.x<mx?2:6;if(ok.has(d)){G.ibadYarn=i;G.mode=MODE.YARN;return d}}if(b.x===mx){let d=b.y<my?4:0;if(ok.has(d)){G.ibadYarn=i;G.mode=MODE.YARN;return d}}if(b.x-mx===b.y-my){let d=b.y<my?3:7;if(ok.has(d)){G.ibadYarn=i;G.mode=MODE.YARN;return d}}if(b.x-mx===my-b.y){let d=b.x>mx?5:1;if(ok.has(d)){G.ibadYarn=i;G.mode=MODE.YARN;return d}}return -1}
function timeReset(){G.cmin=0;G.csec=0;render()}function timeAdd(d){G.csec+=d;if(G.csec>=30){G.cmin=Math.min(30,G.cmin+Math.floor(G.csec/30));G.csec%=30}render()}function scoreAdd(d){G.subscore+=d;G.score+=Math.trunc(G.subscore);G.score=Math.max(0,G.score);G.subscore-=Math.trunc(G.subscore);render()}function minMod(){return G.cmin%LVL_MIN[G.lvl6]}function setTimer(){G.timeG=Math.max(1,Math.floor(G.timeBase*Math.pow(.98,G.level)*Math.pow(.945,Math.floor(G.cmin/LVL_MIN[G.lvl6]))));G.modYarn=Math.max(1,Math.floor(2*G.timeG/50));schedule()}
function tick(){G.timer=null;if(G.paused)return;if(G.mode===MODE.BEGINGAME)modeSet(MODE.BEGINLEVEL);else if(G.mode===MODE.BEGINLEVEL)modeSet(MODE.BEGINN);else if(G.mode===MODE.RESTART){timeAdd(1);modeSet(MODE.PLAY)}else if(G.mode===MODE.BEGINN){badNew(LVL_CK[G.lvl6],TYPE.KAT);if(G.level>3)badNew(2,TYPE.YARN);modeSet(MODE.PLAY)}else if(G.mode===MODE.PLAY){G.ibadYarn=0;badMove();timeAdd(1);scoreAdd(66.67/Math.max(1,G.timeG)*(1+3*(G.cmin===30)));if(G.fDoMelt)modeSet(MODE.ENDGAME)}else if(G.mode===MODE.PLAY_FAST){badMove();G.csec=Math.floor(G.csec/5)*5;timeAdd(5);if(G.cmin>=25)scoreAdd(.67);if(G.cmin>=30)modeSet(MODE.ENDLEVEL);else if(G.cmin<=25&&G.csec===0&&minMod()===0)modeSet(MODE.ENDN)}else if(G.mode===MODE.YARN){yarnMove();G.cmoves=(G.cmoves+1)%Math.max(1,G.modYarn);if(G.cmoves===0){badMove();timeAdd(1);scoreAdd(200/Math.max(1,G.timeG)*(1+2*(G.cmin===30)))}}else if(G.mode===MODE.DYING){if(G.mouse.ch<CH.DEAD){G.mouse.ch++;fldDraw(G.mouse.x,G.mouse.y,G.mouse.ch)}else{fldDraw(G.mouse.x,G.mouse.y,CH.OPEN);guyKill();return}}else if(G.mode===MODE.ENDN){timeAdd(1);modeSet(MODE.BEGINN)}else if(G.mode===MODE.ENDLEVEL){scoreAdd(100*(G.level+1));modeSet(MODE.BEGINLEVEL)}else if(G.mode===MODE.ENDGAME){modeSet(MODE.DEMO1);return}render();schedule()}
// Browser-equivalent persistence for the original WEP INI high-score behavior.
function getScores(){try{return JSON.parse(localStorage.getItem('rodent_scores')||'[]')}catch{return[]}}function saveScores(a){localStorage.setItem('rodent_scores',JSON.stringify(a.slice(0,10)))}
function highScoreOffer(){let rows=getScores();let slot=rows.findIndex(r=>G.score>r.s);if(slot<0&&rows.length<10)slot=rows.length;if(slot<0||G.score<=0){showScores();return}let name=prompt(`恭喜！你已進入 Rodent's Revenge 榮譽榜！\n\n分數：${G.score}\n\n請輸入你的姓名：`,'');name=(name||'匿名').trim().slice(0,24)||'匿名';rows.splice(slot,0,{n:name,s:G.score});saveScores(rows);G.todayScores=[{n:name,s:G.score}];showScores()}
function showScores(){openDialog(`<div id="scores"><h2>Rodent 排行榜</h2><div class="scoreBox"><div class="scoreTitle">榮譽榜</div>${scoreRows(getScores())}</div><div class="scoreBox"><div class="scoreTitle">今日最高分</div>${scoreRows(G.todayScores)}</div><div style="text-align:right"><button id="clearScores">清除分數</button><button data-close>確定</button></div></div>`);document.getElementById('clearScores').onclick=()=>{saveScores([]);G.todayScores=[];closeDialog();showScores()}}
function scoreRows(rows){return rows.length?rows.map((r,i)=>`<div class="scoreRow"><span>${i+1}.</span><span>${esc(r.n)}</span><span>${String(r.s).padStart(8,'0')}</span></div>`).join(''):'<div style="font:12px monospace">尚無紀錄</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDialog(html){let sh=document.getElementById('modalShade');sh.innerHTML=`<div class="dialog">${html}</div>`;sh.style.display='block';sh.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDialog)}function closeDialog(){document.getElementById('modalShade').style.display='none'}
function levelDialog(){let v=prompt('輸入起始關卡：（1-50）',String(G.levelStart+1));if(v!==null){v=Math.max(1,Math.min(50,parseInt(v)||1));G.levelStart=v-1;G.level=v-1;levelNew(G.levelStart);render()}}
function about(){openDialog(`<h2>Rodent's Revenge</h2><p>Christopher Lee Fraley</p><p>使用 Microsoft(R) Visual Basic(TM) 製作</p><p>由 vbgamer45 移植至 32 位元</p><p>https://vbsourcecoderecovery.com</p><div style="text-align:center"><button data-close>確定</button></div>`)}
function helpGap(which){openDialog(`<h2>${esc(which)}</h2><p>原版 RODENT.HLP 已隨附。原生 WinHelp 顯示仍屬尚未實作項目；遊戲規則不會自行創造。</p><div style="text-align:right"><button data-close>確定</button></div>`)}
function newGame(){if(G.mode===MODE.DEMO1)modeSet(MODE.BEGINGAME);else if(confirm('確定要開始新遊戲嗎？'))modeSet(MODE.BEGINGAME)}function pause(){if(G.mode===MODE.DEMO1)return;G.paused=!G.paused;if(G.paused){clearTimeout(G.timer);G.timer=null}else schedule(0);render()}
// Keyboard + browser/mobile input
const keyMap={ArrowUp:0,ArrowRight:2,ArrowDown:4,ArrowLeft:6,PageUp:1,PageDown:3,Home:7,End:5};
addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();newGame()}else if(e.key==='F3'){e.preventDefault();pause()}else if(e.key==='Escape'){e.preventDefault()}else if(!G.paused&&G.mode!==MODE.DEMO1&&G.mode!==MODE.DYING){let d=keyMap[e.key];if(d==null&&/^[1-9]$/.test(e.key))d=KEYPAD[+e.key-1];if(d!=null){e.preventDefault();guyMove(d)}}});
// menus
for(const root of document.querySelectorAll('.menuRoot'))root.onclick=e=>{for(const r of document.querySelectorAll('.menuRoot'))if(r!==root)r.classList.remove('open');root.classList.toggle('open');e.stopPropagation()};document.body.onclick=()=>document.querySelectorAll('.menuRoot').forEach(r=>r.classList.remove('open'));
document.getElementById('newGame').onclick=newGame;document.getElementById('pauseGame').onclick=pause;document.getElementById('highScores').onclick=showScores;document.getElementById('levelSelect').onclick=levelDialog;document.getElementById('about').onclick=about;document.getElementById('exitGame').onclick=()=>{openDialog('<h2>離開</h2><p>瀏覽器頁面無法像原生 Windows 程式一樣自行關閉；你可以關閉目前分頁。</p><div style="text-align:right"><button data-close>確定</button></div>')};document.querySelectorAll('[data-help]').forEach(e=>e.onclick=()=>helpGap(e.dataset.help));document.querySelectorAll('[data-size]').forEach(e=>e.onclick=()=>{G.sizeIndex=+e.dataset.size;layout();render()});document.querySelectorAll('[data-speed]').forEach(e=>e.onclick=()=>{G.speedIndex=+e.dataset.speed;G.timeBase=MP_TIME[G.speedIndex];if(G.mode===MODE.PLAY)setTimer()});
// Touch joystick: 8-way direction, with dead-zone and repeat only after the knob crosses a sector.
const joy=document.getElementById('joystick'),knob=document.getElementById('joyKnob');let joyPointer=null,lastDir=-1;function joyMove(ev){if(ev.pointerId!==joyPointer)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=ev.clientX-cx,dy=ev.clientY-cy,dist=Math.hypot(dx,dy),max=35;let k=Math.min(1,dist/max);knob.style.transform=`translate(${dx/(dist||1)*max*k}px,${dy/(dist||1)*max*k}px)`;if(dist<14){lastDir=-1;return}let ang=Math.atan2(dy,dx),d=Math.round((ang+Math.PI/2)/(Math.PI/4))&7; // up=0, clockwise
if(d!==lastDir){lastDir=d;if(!G.paused&&G.mode!==MODE.DEMO1&&G.mode!==MODE.DYING)guyMove(d)}}joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',joyMove);['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,()=>{joyPointer=null;lastDir=-1;knob.style.transform=''}));
// boot
function boot(){layout();Promise.all([artSmall.decode?.(),artLarge.decode?.(),artClock.decode?.()].map(p=>p||Promise.resolve())).finally(()=>{fldErase(CH.OPEN);modeSet(MODE.DEMO1);render();stageSize()})}addEventListener('resize',stageSize);boot();
