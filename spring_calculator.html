<script>
const $=s=>document.querySelector(s),dm=(m,v,d)=>m==='od'?v-d:m==='id'?v+d:v,dv=(m,D,d)=>m==='od'?D+d:m==='id'?D-d:D;
let S={fu:'kgf',dec:4,mt:'SUS-304 WP--B'},cur='cyl';
let M=[['SSWIC--F',8160,21400],['SWP--B',8160,21400],['鏻青銅線B-519 ( PBW)',4390,10200],['SUS-304 WP--B',7040,19400],['不銹鋼(SUS--304)',7040,19400],['鋁青銅',4200,11000],['軟鋼',8410,21150],['硬鋼 ',8360,20900],['高炭鋼',8160,20300]]; /* 完全依原版 mat.mdb（Material 資料表）：名稱、G=橫彈性係數(material_bulk_modulus)、E=縱彈性係數(material_young_modulus)，單位 kgf/sq.mm，順序同原版 */
const MD=M.map(a=>a.slice());
M=MD.map(a=>a.slice());
try{Object.assign(S,JSON.parse(localStorage.getItem('sw_s')||'{}'));const m=JSON.parse(localStorage.getItem('sw_m')||'null');if(Array.isArray(m)&&m.length)M=m}catch(e){}

if((S.mv||0)<5){M=MD.map(a=>a.slice());S.mv=5;if(!M.some(m=>m[0]===S.mt))S.mt=M[3][0];save()}

if(S.mv<7){S.fd='kgf';S.fu='kgf';S.mv=7;save()} /* 版本 7：制式分「預設制式 S.fd」與「目前制式 S.fu」；每次進入計算畫面都回到預設（原版預設 kgf） */ /* 版本 6：預設制式改回原版的 kgf，橫彈性係數直接顯示資料庫數值 */ /* 版本 5：材料庫重設為原版 mat.mdb 的 9 筆，移除先前自行加入的擴充材料 */
const fk=()=>S.fu==='N'?9.8:1,fmt=(x,n)=>isFinite(x)?(+x).toFixed(n==null?S.dec:n):'',uu=()=>document.querySelectorAll('[data-f]').forEach(e=>e.textContent=S.fu+e.dataset.f);
const n=(id,l,u,v)=>({id,l,u,v}),dg=(i,p,m,v)=>({dia:i,p,m,v}),U5=['F','k','d','D','Na'];
const T={
cyl:{t:'壓力計算（柱形）',F:'所需壓力',w:'負荷高度須小於自由高度',u:U5,L:[n('d','線徑','mm',1),dg(1,'','id',8.7),n('Na','有效卷數','',21)],R:[n('H0','自由高度','mm',150),n('H1','負荷高度','mm',122.4)]},
cone:{t:'壓力計算（塔形）',F:'所需壓力',w:'負荷高度須小於自由高度',u:['F','k','d','Na'],L:[n('d','線徑','mm',1.2),dg(1,'最小','od',9.2),dg(2,'最大','od',17.8)],R:[n('Nt','總卷數','',17.5),n('Na','有效卷數','',15.5),{pt:1,v:1.7},n('H0','自由高度','mm',30),n('H1','負荷高度','mm',22)]},
ext:{t:'拉力計算',F:'所需拉力',w:'負荷長度須大於自由長度',u:U5,L:[n('d','線徑','mm',1),dg(1,'','od',10),n('Na','有效卷數','',20)],R:[n('H0','自由長度','mm',40),n('H1','負荷長度','mm',50),{fi:1}]},
tor:{t:'扭力計算',F:'所需扭力',w:'負荷角度須大於自由角度',u:U5,L:[n('d','線徑','mm',1.2),dg(1,'','od',11.2),n('Na','有效卷數','',6),n('X1','臂長（支點）','mm',25),n('X2','臂長（力點）','mm',25)],R:[n('A0','自由角度','deg',0),n('A1','負荷角度','deg',60),n('Lp','負荷點','mm',25)]}};
const UL={k:'彈簧定數',d:'線徑',D:'螺旋中心徑',Na:'有效卷數'},MN=[['cone','壓力（塔形）'],['cyl','壓力（柱形）'],['ext','拉　力'],['tor','扭　力'],['mat','材料資料庫'],['set','系統設定']];
const ku=()=>S.fu+(cur==='tor'?'·mm/deg':'/mm');
function item(x){
 if(x.fi)return ['<div class="r"><span>初張力</span><label class="rd"><input type="radio" name="fim" value="def" checked>默認值</label></div>','<div class="r"><span class="vh">初張力</span><div class="f"><label class="rd"><input type="radio" name="fim" value="cus">自訂</label><input id="f_fi" type="number" step="any"><b class="u" data-f=""></b></div></div>'];
 if(x.pt)return ['<div class="r"><span>螺距</span><div class="f"><input id="f_pt" type="number" step="any" value="'+x.v+'"><b class="u">mm</b></div></div>'];
 if(x.dia){const i=x.dia;return ['<div class="r"><select id="m'+i+'">'+[['od','螺旋外徑'],['id','螺旋內徑'],['dm','螺旋中心徑']].map(a=>'<option value="'+a[0]+'"'+(a[0]===x.m?' selected':'')+'>'+x.p+a[1]+'</option>').join('')+'</select><div class="f"><input id="f_v'+i+'" type="number" step="any" value="'+x.v+'"><b class="u">mm</b></div></div>','<div class="r"><span>'+x.p+'螺旋中心徑</span><div class="f"><input id="f_c'+i+'" class="ro" readonly tabindex="-1"><b class="u">mm</b></div></div>']}
 return ['<div class="r"><span>'+x.l+'</span><div class="f"><input id="f_'+x.id+'" type="number" step="any" value="'+x.v+'"><b class="u">'+x.u+'</b></div></div>']}
function render(s){
 kill3d();cur=s;S.fu=S.fd||'kgf';const c=T[s],tor=s==='tor',g=M.find(m=>m[0]===S.mt)||M[0];
 const Lr=['<label class="r"><span>材料</span><select id="mt">'+M.map(m=>'<option value="'+String(m[0]).replace(/"/g,'&quot;')+'">'+m[0]+'</option>').join('')+'</select></label>','<label class="r"><span>'+(tor?'縱':'橫')+'彈性係數</span><div class="f"><input id="f_G" type="number" step="any" value="'+((tor?g[2]:g[1])*fk()).toFixed(4)+'"><b class="u" data-f="/sq.mm"></b></div></label>',''].concat(...c.L.map(item)),
  Rr=['<label class="r"><span>制式</span><select id="fu"><option>kgf</option><option>N</option></select></label>','<label class="r"><span>單位</span><select disabled><option>mm</option></select></label>',''].concat(...c.R.map(item)),
  cl=(a,k)=>a.map((h,i)=>h?'<div class="'+k+'" style="grid-row:'+(i+1)+'">'+h+'</div>':'').join(''),
  grid='<div class="sp" style="grid-row:3"></div>'+cl(Lr,'a')+cl(Rr,'b');
 $('#calc').innerHTML='<div class="top"><div class="tl"><label class="r"><span>函數</span><select id="unk">'+c.u.map(u=>'<option value="'+u+'">'+(u==='F'?c.F:UL[u])+'</option>').join('')+'</select></label><label class="r"><span id="ol"></span><div class="f"><input id="out" class="ro" readonly><b class="u" id="ou"></b></div></label><label class="r" id="kr"><span id="kl">已知'+c.F.slice(2)+'</span><div class="f"><input id="f_Fk" type="number" step="any"><b class="u" data-f=""></b></div></label></div><div class="bt"><button id="pf">列印PDF</button><button data-g="home">退出</button></div></div>'
 +'<fieldset class="pm"><legend>參數設定</legend><div class="cols">'+grid+'</div></fieldset><p id="msg"></p><div id="wn" class="card" hidden></div><div id="aux"></div><div id="sim" class="card" hidden></div>';
 $('#mt').value=g[0];$('#fu').value=S.fu;uu();setUnk()}
function setUnk(){
 const c=T[cur],u=$('#unk').value;
 $('#ol').textContent=u==='F'?c.F:UL[u];$('#ou').textContent={F:S.fu,k:ku(),d:'mm',D:'mm',Na:''}[u];
 ['f_d','f_Na','f_v1'].forEach(id=>{const e=$('#'+id);if(e){e.readOnly=false;e.classList.remove('ro')}});
 const t={d:'f_d',Na:'f_Na',D:'f_v1'}[u];if(t){const e=$('#'+t);e.readOnly=true;e.classList.add('ro')}

function P(){
 const p={};document.querySelectorAll('#calc [id^=f_]').forEach(e=>{p[e.id.slice(2)]=parseFloat(e.value)});
 [1,2].forEach(i=>{const m=$('#m'+i);if(m)p['m'+i]=m.value});
 const r=document.querySelector('[name=fim]:checked');p.fim=r&&r.value;return p}
function upd(){
 const p=P(),u=$('#unk').value;
 [1,2].forEach(i=>{const e=$('#f_c'+i);if(!e||(i===1&&u==='D'))return;const D=dm(p['m'+i],p['v'+i],p.d);e.value=D>0&&isFinite(D)?fmt(D):''});}
const dlt=p=>cur==='ext'?p.H1-p.H0:cur==='tor'?p.A1-p.A0:p.H0-p.H1;
/* ---- 塔形：螺距／逐圈壓死模型（依原版 5 組實測反推，誤差 < 0.02%）----
   有效圈 Na 圈，半徑由最小中心徑線性增至最大中心徑；每圈變形 = 64·F·R³/(G·d⁴)。
   每圈最多只能壓縮 g = 螺距 − sqrt(d² − s²)，s = (Dmax−Dmin)/(2·Na) 為相鄰圈徑向錯位，
   壓死時相鄰線材中心軸向間距因徑向錯位縮短為 sqrt(d²−s²)。
   半徑大的圈先壓死，壓死後不再參與變形，剩餘有效圈變少 → 彈簧變硬。 */
function coneNL(p,d,a,b,dl){
 const Na=p.Na,T=Na,sl=(b-a)/2/Na,g=p.pt-Math.sqrt(Math.max(d*d-sl*sl,0));if(!(g>0)||!(dl>0))return null;

 if(dl>=cap*(1-1e-9))return{over:true,cap,T};

  y=F=>{if(!(F>0))return 0;
   if(rb-ra<1e-9)return T*Math.min(64*F*ra**3/c4,g);

   if(R>=rb)return F*16*T*(rb**4-ra**4)/(rb-ra)/c4;

 let lo=0,hi=1;while(y(hi)<dl&&hi<1e12)hi*=2;
 for(let i=0;i<100;i++){const m=(lo+hi)/2;y(m)<dl?lo=m:hi=m}
 const F=(lo+hi)/2,R=Rb(F),nb=rb-ra<1e-9?(64*F*ra**3/c4<g?T:0):R>=rb?T:R<=ra?0:T*(R-ra)/(rb-ra);
 return{F,T,cap,closed:T-nb,Da:R>=rb?b:Math.min(Math.max(2*R,a),b)}}

 if(cur==='cone'){const a=Dm(1),b=Dm(2);if(!(a>d&&b>=a&&p.Na>0))return;D=b;k=k0=p.G*d**4/(2*p.Na*(a+b)*(a*a+b*b));F=k*dl;cn=coneNL(p,d,a,b,dl);

 else if(id==='fu'){const o=S.fu;S.fu=e.target.value;if(o===S.fu)return;const f=S.fu==='N'?9.8:1/9.8;['f_G','f_Fk','f_fi'].forEach(i=>{const el=$('#'+i);if(el&&el.value!=='')el.value=+(el.value*f).toFixed(4)});save();uu();setUnk()}});
C.addEventListener('click',e=>{

const STEP={f_d:.1,f_Na:.5,f_Nt:.5,f_pt:.1,f_v1:.1,f_v2:.1,f_H0:.1,f_H1:.1,f_A0:1,f_A1:1,f_X1:1,f_X2:1,f_Lp:1,f_G:100,f_Fk:.1,f_fi:.1,s2:1};
const okEl=el=>el&&el.matches&&el.matches('input[type=number]:not([readonly]):not([disabled])');
function bump(el,dir,mul){
 const st=(STEP[el.id]||(+el.dataset.k>0?100:1))*mul;
 let v=parseFloat(el.value);if(!isFinite(v))v=0;
 v=Math.round((v+dir*st)*1e6)/1e6;
 const lo=el.min!==''?+el.min:(/^f_A[01]$/.test(el.id)?-Infinity:0);
 if(v<lo)v=lo;if(el.max!==''&&v>+el.max)v=+el.max;
 el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
const mulOf=e=>e.shiftKey?10:(e.ctrlKey||e.altKey?.1:1);
document.addEventListener('wheel',e=>{const dy=e.deltaY||e.deltaX;if(!okEl(e.target)||!dy)return;e.preventDefault();bump(e.target,dy<0?1:-1,mulOf(e))},{passive:false});
document.addEventListener('keydown',e=>{if((e.key!=='ArrowUp'&&e.key!=='ArrowDown')||!okEl(e.target))return;e.preventDefault();bump(e.target,e.key==='ArrowUp'?1:-1,mulOf(e))});
