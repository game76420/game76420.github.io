<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>接龍</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#008000;font-family:"MS Sans Serif","Microsoft JhengHei",sans-serif;color:#000}
body{touch-action:none}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:#c0c0c0}
.menubar{height:28px;min-height:28px;background:#c0c0c0;display:flex;align-items:center;padding-left:2px;border-bottom:1px solid #808080;z-index:20}
.menu-btn{border:0;background:transparent;padding:3px 8px;height:26px;font:14px "MS Sans Serif","Microsoft JhengHei",sans-serif;text-align:left}
.menu-btn:hover,.menu-btn.active{background:#000080;color:white}
.dropdown{position:absolute;top:28px;left:2px;min-width:190px;background:#c0c0c0;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;box-shadow:2px 2px #000;z-index:50;padding:2px}
.dropdown.help{left:85px}
.dropdown button{display:block;width:100%;height:28px;border:0;background:#c0c0c0;text-align:left;padding:3px 12px;font:14px "MS Sans Serif","Microsoft JhengHei",sans-serif}
.dropdown button:hover:not(:disabled){background:#000080;color:#fff}.dropdown button:disabled{color:#808080}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#008000;overflow:hidden}
#boardWrap{width:min(100vw,calc((100vh - 28px)*585/384));height:min(calc(100vh - 28px),calc(100vw*384/585));aspect-ratio:585/384;position:relative;flex:none;background:#008000}
#board{width:100%;height:100%;display:block;image-rendering:auto;touch-action:none}
#modalLayer{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:flex;align-items:center;justify-content:center;padding:10px}
#modalLayer[hidden]{display:none}
.modal{background:#c0c0c0;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;box-shadow:2px 2px #000;max-width:min(96vw,560px);max-height:92vh;overflow:auto;padding:14px;position:relative}
.modal h2{font-size:18px;margin:0 0 12px;font-weight:bold}.close-x{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:20px}
.group{border:1px solid #808080;margin:8px 0;padding:12px 10px 9px;position:relative}.group legend{padding:0 5px;font-weight:bold}
.options-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}.opt label{display:block;margin:7px 0;font-size:16px}.opt input{margin-right:7px}
.actions{text-align:center;margin-top:14px}.btn{min-width:84px;margin:0 5px;padding:7px 18px;background:#c0c0c0;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;font-weight:bold}.btn:active{border-color:#404040 #fff #fff #404040}
.back-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.back-item{border:2px solid transparent;padding:2px;background:#c0c0c0}.back-item.selected{border-color:#000080;outline:1px dotted #fff}.back-item img{display:block;width:100%;height:auto;aspect-ratio:71/96;image-rendering:auto}
.about{text-align:center;min-width:280px}.about p{margin:8px 0}.about small{color:#333}
@media(max-width:520px){.menubar{height:32px;min-height:32px}.dropdown{top:32px}.dropdown.help{left:105px}.boardWrap{} .options-grid{grid-template-columns:1fr}.back-grid{grid-template-columns:repeat(4,1fr)}.modal{padding:12px}.group{padding:10px}.opt label{font-size:15px}}

</style>
</head>
<body>
<div id="app">
  <div class="menubar">
    <button class="menu-btn" data-menu="game">遊戲(G)</button>
    <button class="menu-btn" data-menu="help">輔助說明(H)</button>
  </div>
  <div id="gameMenu" class="dropdown" hidden>
    <button data-action="new">發牌(&D)</button>
    <button data-action="testwin">全破測試(&T)</button>
    <button id="undoBtn" data-action="undo" disabled>復原(&U)</button>
    <button data-action="backs">紙牌花色(&C)...</button>
    <button data-action="options">選項(&O)...</button>
    <button data-action="exit">結束(&X)</button>
  </div>
  <div id="helpMenu" class="dropdown help" hidden>
    <button data-action="about">關於(&A)...</button>
  </div>
  <main id="stage">
    <div id="boardWrap">
      <canvas id="board" width="585" height="384"></canvas>
    </div>
  </main>
</div>
<div id="modalLayer" hidden></div>
<script>
'use strict';
const W=585,H=384,CARD_W=71,CARD_H=96,GAP=11,PITCH=82,TOP_Y=5,TABLEAU_Y=107,WASTE_STEP=14,FACE_UP=0x8000,VALUE_MASK=0x7fff;
const BACK_IDS=[0x36,0x37,0x3c,0x3d,0x3a,0x3b,0x38,0x39,0x3e,0x3f,0x40,0x41];
const BACK_RES=BACK_IDS.map(x=>x);
const DEFAULT_BACK=64; // explicit user-requested beach bitmap: Card_Bitmap_64.bmp
const MODE_STANDARD=0x12e,MODE_VEGAS=0x12f,MODE_OTHER=0x130;
const SCORE_STD=[-2,-20,10,5,5,-15,0,0], SCORE_VEGAS=[0,0,5,0,0,-5,-52,0];
const $=id=>document.getElementById(id); const canvas=$('board'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const imgCache=Object.create(null);
const imgState=Object.create(null);
const ASSET_BASE = new URL('assets/', document.baseURI).href;
// External PNGs remain the primary source. A tiny retry/cache layer makes the
// same HTML reliable in desktop Chrome and Android Chrome, including file:// use.
function img(id){
  if(!imgCache[id]){
    const i=new Image();
    i.decoding='async';
    i.draggable=false;
    imgState[id]='loading';
    i.onload=()=>{imgState[id]='ready'; render();};
    i.onerror=()=>{imgState[id]='error';};
    i.src=new URL(`Card_Bitmap_${id}.png`, ASSET_BASE).href;
    imgCache[id]=i;
  }
  return imgCache[id];
}
function readyImg(id,cb){
  const i=img(id);
  if(i.complete && i.naturalWidth>0) cb(i);
  else i.addEventListener('load',()=>cb(i),{once:true});
}
function imageReady(id){const i=img(id);return i.complete&&i.naturalWidth>0;}
const REQUIRED_IMAGE_IDS=[...Array.from({length:65},(_,i)=>i+1),67,68];
let assetsReady=false;
function preloadImages(){
  return Promise.all(REQUIRED_IMAGE_IDS.map(id=>new Promise(resolve=>{
    const i=img(id);
    if(i.complete){resolve(i.naturalWidth>0);return;}
    i.addEventListener('load',()=>resolve(true),{once:true});
    i.addEventListener('error',()=>resolve(false),{once:true});
  }))).then(results=>{
    assetsReady=results.some(Boolean);
    render();
    return results;
  });
}
class RNG{constructor(seed){this.low=seed&65535;this.high=0} rand15(){const low=this.low,high=this.high,product=low*0x43fd,lo=product&65535,hi=((product>>>16)+high*0x43fd+low*3)&65535,state=(((hi<<16)|lo)+0x269ec3)>>>0;this.low=state&65535;this.high=(state>>>16)&65535;return this.high&0x7fff} mod(n){return this.rand15()%n}}
function shuffle5(cards,rng){for(let p=0;p<5;p++)for(let i=0;i<cards.length;i++){const j=rng.mod(cards.length);[cards[i],cards[j]]=[cards[j],cards[i]]}return cards}
function rank(v){return (v&VALUE_MASK)>>2} function suit(v){return v&3} function faceUp(v){return !!(v&FACE_UP)}
function resourceId(v){const index=v&VALUE_MASK;return ((index>>2)%13)+(index&3)*13+1}
function cardWord(i,up=false){return i|(up?FACE_UP:0)}
function cDiv(a,b){return a<0?Math.ceil(a/b):Math.floor(a/b)}
function tableauAccepts(card,target){if(rank(card)===12)return target.length===0;if(!target.length)return false;const top=target[target.length-1];const sc=suit(card),st=suit(top);return faceUp(top)&&rank(top)-rank(card)===1&&st!==sc&&((st^sc)<3)}
function foundationAccepts(card,target){if(!target.length)return rank(card)===0;const top=target[target.length-1];return rank(card)-rank(top)===1&&suit(top)===suit(card)}
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('sol-html-settings')||'{}');return {drawCount:s.drawCount===3?3:1,mode:[MODE_STANDARD,MODE_VEGAS,MODE_OTHER].includes(s.mode)?s.mode:MODE_STANDARD,statusDisplay:s.statusDisplay??true,timedGame:s.timedGame??true,outlineOnly:s.outlineOnly??false,scoreBonus:s.scoreBonus??false,backId:BACK_IDS.includes(s.backId)?s.backId:DEFAULT_BACK};}catch{return {drawCount:1,mode:MODE_STANDARD,statusDisplay:true,timedGame:true,outlineOnly:false,scoreBonus:false,backId:DEFAULT_BACK}}}
function saveSettings(){localStorage.setItem('sol-html-settings',JSON.stringify({drawCount:S.drawCount,mode:S.mode,statusDisplay:S.statusDisplay,timedGame:S.timedGame,outlineOnly:S.outlineOnly,scoreBonus:S.scoreBonus,backId:S.backId}))}
const S={...loadSettings(),tableau:Array.from({length:7},()=>[]),stock:[],waste:[],foundation:Array.from({length:4},()=>[]),score:0,moves:0,start:Date.now(),drag:null,won:false,anim:null,undo:null};
function cardClonePile(p){return p.map(v=>v);} function makeUndoSnapshot(){return {tableau:S.tableau.map(cardClonePile),stock:cardClonePile(S.stock),waste:cardClonePile(S.waste),foundation:S.foundation.map(cardClonePile),score:S.score,moves:S.moves,won:S.won};}
function saveUndo(){S.undo=makeUndoSnapshot();updateUndoUI();}
function restoreUndo(){if(!S.undo)return false;const u=S.undo;S.tableau=u.tableau.map(cardClonePile);S.stock=cardClonePile(u.stock);S.waste=cardClonePile(u.waste);S.foundation=u.foundation.map(cardClonePile);S.score=u.score;S.moves=u.moves;S.won=u.won;S.undo=null;S.drag=null;S.anim=null;updateUndoUI();render();return true;}
function updateUndoUI(){const b=$('undoBtn');if(b)b.disabled=!S.undo;}
function newGame(){const rng=new RNG((Date.now()^((Math.random()*65535)|0))&65535);let cards=Array.from({length:52},(_,i)=>i);shuffle5(cards,rng);S.tableau=Array.from({length:7},()=>[]);S.stock=[];S.waste=[];S.foundation=Array.from({length:4},()=>[]);S.score=0;S.moves=0;S.start=Date.now();S.drag=null;S.won=false;S.anim=null;S.undo=null;let k=0;for(let col=0;col<7;col++){for(let dst=col;dst<7;dst++){let c=cards[k++];S.tableau[dst].push(cardWord(c,dst===col));}}S.stock=cards.slice(k);render();}
function syncScore(event){if(S.mode===MODE_OTHER)return;if(event<0)return;let d=0;if(S.mode===MODE_STANDARD)d=SCORE_STD[event]??0;else d=SCORE_VEGAS[event]??0;S.score=S.mode===MODE_STANDARD?Math.max(0,S.score+d):S.score+d}
function draw(){if(S.stock.length){saveUndo();const n=Math.min(S.drawCount,S.stock.length);for(let i=0;i<n;i++){let c=S.stock.pop();c=(c&VALUE_MASK)|FACE_UP;S.waste.push(c)}if(n)S.moves++;render();return} if(S.waste.length){saveUndo();S.stock=S.waste.slice().reverse().map(c=>c&VALUE_MASK);S.waste=[];S.moves++;render();}}
function moveToFoundationFromPile(pile){if(!pile.length)return false;const c=pile[pile.length-1];for(let fi=0;fi<4;fi++)if(foundationAccepts(c,S.foundation[fi])){saveUndo();pile.pop();S.foundation[fi].push(c);S.moves++;syncScore(2);checkWin();render();return true}return false}
function checkWin(){if(S.foundation.every(p=>p.length===13)){S.won=true;startWinAnimation();}}
function hitTableau(x,y){for(let col=0;col<7;col++){const xx=GAP+col*PITCH,p=S.tableau[col];if(x<xx||x>=xx+CARD_W||p.length===0)continue;let idx=0,yy=TABLEAU_Y;for(let i=0;i<p.length;i++){if(y>=yy&&y<yy+CARD_H)idx=i;yy+=faceUp(p[i])?12:3} if(y>=TABLEAU_Y&&y<yy+CARD_H)return {col,idx,x:xx,y:Math.min(yy, y)}}return null}
function tableauCardY(p,idx){let y=TABLEAU_Y;for(let i=0;i<idx;i++)y+=faceUp(p[i])?12:3;return y}
function hit(x,y){if(x>=GAP&&x<GAP+CARD_W&&y>=TOP_Y&&y<TOP_Y+CARD_H)return {type:'stock'};if(x>=GAP+PITCH&&x<GAP+PITCH+CARD_W&&y>=TOP_Y&&y<TOP_Y+CARD_H)return {type:'waste'};for(let fi=0;fi<4;fi++){const xx=GAP+3*PITCH+fi*PITCH;if(x>=xx&&x<xx+CARD_W&&y>=TOP_Y&&y<TOP_Y+CARD_H)return {type:'foundation',fi}}return hitTableau(x,y)?{type:'tableau',...hitTableau(x,y)}:null}
function moveTableau(sc,si,dc){if(sc===dc)return false;const src=S.tableau[sc],dst=S.tableau[dc],c=src[si];if(c==null||!faceUp(c)||!tableauAccepts(c,dst))return false;saveUndo();dst.push(...src.splice(si));S.moves++;render();return true}
function pointerPos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function pointerDown(e){if(S.anim)return;const p=pointerPos(e),h=hit(p.x,p.y);if(!h)return;if(h.type==='stock'){draw();return}if(h.type==='waste'&&S.waste.length){const c=S.waste[S.waste.length-1];if(faceUp(c)){S.drag={type:'waste',index:S.waste.length-1,ox:p.x,oy:p.y,x:p.x,y:p.y,dx:p.x-(GAP+PITCH+(S.drawCount===3?Math.max(0,Math.min(3,S.waste.length)-1)*WASTE_STEP:0)),dy:p.y-TOP_Y,moved:false};canvas.setPointerCapture?.(e.pointerId);render();return}}if(h.type==='foundation'&&S.foundation[h.fi].length){const c=S.foundation[h.fi].at(-1);S.drag={type:'foundation',fi:h.fi,ox:p.x,oy:p.y,x:p.x,y:p.y,dx:p.x-(GAP+3*PITCH+h.fi*PITCH),dy:p.y-TOP_Y,moved:false};canvas.setPointerCapture?.(e.pointerId);render();return}if(h.type==='tableau'){const p0=S.tableau[h.col];const c=p0[h.idx];const yy=tableauCardY(p0,h.idx);if(!faceUp(c)) {if(h.idx===p0.length-1){saveUndo();p0[h.idx]=(c&VALUE_MASK)|FACE_UP;syncScore(4);render()}return;}S.drag={type:'tableau',col:h.col,index:h.idx,ox:p.x,oy:p.y,x:p.x,y:p.y,dx:p.x-(GAP+h.col*PITCH),dy:p.y-yy,moved:false};canvas.setPointerCapture?.(e.pointerId);render();}}
function pointerMove(e){if(!S.drag)return;const p=pointerPos(e);if(Math.abs(p.x-S.drag.ox)>4||Math.abs(p.y-S.drag.oy)>4)S.drag.moved=true;S.drag.x=p.x;S.drag.y=p.y;render()}
function pointerUp(e){if(!S.drag)return;const d=S.drag,p=pointerPos(e);S.drag=null;if(!d.moved){render();return;}let ok=false;if(d.type==='tableau'){for(let dc=0;dc<7;dc++){const xx=GAP+dc*PITCH;if(p.x>=xx&&p.x<xx+CARD_W){ok=moveTableau(d.col,d.index,dc);break}}if(!ok&&p.x>=GAP+3*PITCH&&p.x<GAP+7*PITCH){ok=moveToFoundationFromPile(S.tableau[d.col]);}}else if(d.type==='waste'){for(let dc=0;dc<7;dc++){const xx=GAP+dc*PITCH;if(p.x>=xx&&p.x<xx+CARD_W){const c=S.waste.at(-1);if(c&&tableauAccepts(c,S.tableau[dc])){saveUndo();S.tableau[dc].push(S.waste.pop());S.moves++;syncScore(3);ok=true;break}}}if(!ok){for(let fi=0;fi<4;fi++){const xx=GAP+3*PITCH+fi*PITCH;if(p.x>=xx&&p.x<xx+CARD_W){const c=S.waste.at(-1);if(c&&foundationAccepts(c,S.foundation[fi])){saveUndo();S.foundation[fi].push(S.waste.pop());S.moves++;syncScore(2);ok=true;break} }}}}else if(d.type==='foundation'){for(let dc=0;dc<7;dc++){const xx=GAP+dc*PITCH;if(p.x>=xx&&p.x<xx+CARD_W&&tableauAccepts(S.foundation[d.fi].at(-1),S.tableau[dc])){saveUndo();S.tableau[dc].push(S.foundation[d.fi].pop());S.moves++;syncScore(5);ok=true;break}}if(!ok){for(let fi=0;fi<4;fi++){const xx=GAP+3*PITCH+fi*PITCH;if(fi!==d.fi&&p.x>=xx&&p.x<xx+CARD_W&&foundationAccepts(S.foundation[d.fi].at(-1),S.foundation[fi])){saveUndo();S.foundation[fi].push(S.foundation[d.fi].pop());ok=true;break}}}}if(ok)checkWin();render()}
function doubleClick(e){if(S.anim)return;const p=pointerPos(e),h=hit(p.x,p.y);if(!h)return;if(h.type==='tableau'){const pile=S.tableau[h.col];if(pile.length&&h.idx===pile.length-1&&faceUp(pile.at(-1)))moveToFoundationFromPile(pile)}else if(h.type==='waste'){const pile=S.waste;if(pile.length&&faceUp(pile.at(-1)))moveToFoundationFromPile(pile)}else if(h.type==='foundation'){return}if(S.foundation.every(p=>p.length===13))checkWin()}
let lastTap=0;canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',()=>{S.drag=null;render()});canvas.addEventListener('dblclick',doubleClick);
function drawCard(v,x,y,alpha=1){const id=faceUp(v)?resourceId(v):S.backId;const i=img(id);if(!imageReady(id))return;ctx.globalAlpha=alpha;ctx.drawImage(i,x,y,CARD_W,CARD_H);ctx.globalAlpha=1}
function drawEmpty(x,y){const i=img(53);if(!imageReady(53))return;ctx.drawImage(i,x,y,CARD_W,CARD_H)}
function drawBackground(){ctx.fillStyle='#008000';ctx.fillRect(0,0,W,H)}
function render(){drawBackground();if(S.stock.length){const layers=Math.floor((S.stock.length-1)/10)+1;for(let i=0;i<layers;i++)drawCard(S.stock[0],GAP+2*i,TOP_Y+i)}else{const i=img(68);if(imageReady(68))ctx.drawImage(i,GAP,TOP_Y,CARD_W,CARD_H)}
if(S.waste.length){let start;if(S.drawCount===1)start=(S.drag?.type==='waste'?Math.max(0,S.waste.length-2):S.waste.length-1);else start=Math.max(0,S.waste.length-Math.min(3,S.waste.length));for(let i=start;i<S.waste.length;i++){if(S.drag?.type==='waste'&&i===S.waste.length-1)continue;const wx=GAP+PITCH+(S.drawCount===1?0:(i-start)*WASTE_STEP);drawCard(S.waste[i],wx,TOP_Y)}}
for(let fi=0;fi<4;fi++){const x=GAP+3*PITCH+fi*PITCH,p=S.foundation[fi];if(S.drag?.type==='foundation'&&S.drag.fi===fi){if(p.length>=2)drawCard(p[p.length-2],x,TOP_Y);else drawEmpty(x,TOP_Y)}else if(p.length)drawCard(p.at(-1),x,TOP_Y);else drawEmpty(x,TOP_Y)}
for(let col=0;col<7;col++){const x=GAP+col*PITCH,p=S.tableau[col];for(let i=0;i<p.length;i++){if(S.drag?.type==='tableau'&&S.drag.col===col&&i>=S.drag.index)continue;drawCard(p[i],x,tableauCardY(p,i))}}
if(S.drag){let v;if(S.drag.type==='tableau')v=S.tableau[S.drag.col][S.drag.index];else if(S.drag.type==='waste')v=S.waste.at(-1);else v=S.foundation[S.drag.fi].at(-1);if(v!=null){let x=S.drag.x-S.drag.dx,y=S.drag.y-S.drag.dy;if(S.outlineOnly){ctx.save();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(Math.round(x)+.5,Math.round(y)+.5,CARD_W-1,CARD_H-1);ctx.restore()}else if(S.drag.type==='tableau'){const p=S.tableau[S.drag.col];for(let i=S.drag.index;i<p.length;i++){drawCard(p[i],x,y);y+=faceUp(p[i])?12:3}}else drawCard(v,x,y)}}
if(S.statusDisplay){ctx.fillStyle='#cdcdcd';ctx.fillRect(0,H-20,W,20);ctx.fillStyle='#000';ctx.font='bold 14px "MS Sans Serif","Microsoft JhengHei",sans-serif';ctx.textAlign='right';const sec=Math.max(0,Math.floor((Date.now()-S.start)/1000));ctx.fillText(`分數: ${S.score} 時間: ${S.timedGame?sec:0}`,W-4,H-5);ctx.textAlign='left'}
if(S.anim)renderWinFrame();}
function startWinAnimation(){if(S.anim)return;const rng=new RNG((Date.now()^S.moves)&65535),parts=[];for(let row=12;row>=0;row--)for(let fi=0;fi<4;fi++){const x=GAP+3*PITCH+fi*PITCH,y=TOP_Y;let vx=(rng.rand15()%0x6e)-0x41;if(Math.abs(vx)<0xf)vx=-0x14;let vy=(rng.rand15()%0x6e)-0x4b;parts.push({x,y,vx,vy,card:S.foundation[fi][row],trail:[]})}S.anim={parts,i:0,acc:0};requestAnimationFrame(winTick)}
function renderWinFrame(){const a=S.anim;if(!a||a.i>=a.parts.length)return;const p=a.parts[a.i];
  // Persistent long trail: old card images are deliberately not erased.
  // This is a visual-only enhancement; the SOURCE-proven trajectory remains unchanged.
  if(p.trail&&p.trail.length){for(let i=0;i<p.trail.length;i++){const t=p.trail[i];drawCard(p.card,t.x,t.y,0.78)}}
  drawCard(p.card,p.x,p.y)}
function winTick(ts){
  if(!S.anim)return;
  const a=S.anim,p=a.parts[a.i];
  if(!p){S.anim=null;render();setTimeout(()=>victoryPrompt(),0);return}

  // Draw the current card and permanently accumulate its long trail.
  renderWinFrame();
  p.trail.push({x:p.x,y:p.y});

  // Keep the SOURCE-proven movement arithmetic unchanged.
  p.x+=cDiv(p.vx,10);
  p.y+=cDiv(p.vy,10);
  p.vy+=3;
  const bottom=H-CARD_H;
  if(bottom<p.y&&p.vy>0)p.vy=cDiv(p.vy*8,-10);

  // The instant the entire card has left the board, switch to the next card.
  // Do not wait for another animation frame while the old card is off-screen.
  if(p.x<=-CARD_W || p.x>=W || p.y<=-CARD_H || p.y>=H){
    a.i++;
    a.acc=0;
    requestAnimationFrame(winTick);
    return;
  }

  a.acc++;
  setTimeout(()=>requestAnimationFrame(winTick),7);
}
function startWinTest(){if(S.anim)return;closeMenus();closeModal();
  // Test-only state: construct four completed foundations without playing.
  S.tableau=Array.from({length:7},()=>[]);S.stock=[];S.waste=[];
  S.foundation=Array.from({length:4},(_,s)=>Array.from({length:13},(_,r)=>cardWord(r*4+s,true)));
  S.score=0;S.moves=0;S.won=true;S.start=Date.now();S.drag=null;S.undo=null;updateUndoUI();render();startWinAnimation();
}
function victoryPrompt(){if(!S.won)return;showMessage('再玩?','接龍',()=>{newGame();});}
function showMessage(text,title,onYes){openModal(`<div class="modal about"><button class="close-x" data-close>×</button><h2>${title}</h2><p style="font-size:18px">${text}</p><div class="actions"><button class="btn" data-yes>確定</button><button class="btn" data-close>取消</button></div></div>`);$('modalLayer').querySelector('[data-yes]').onclick=()=>{closeModal();onYes&&onYes()}}
function openModal(html){$('modalLayer').innerHTML=html;$('modalLayer').hidden=false;$('modalLayer').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){$('modalLayer').hidden=true;$('modalLayer').innerHTML=''}
function showOptions(){
const old={drawCount:S.drawCount,mode:S.mode,timedGame:S.timedGame};
openModal(`<div class="modal"><button class="close-x" data-close>×</button><h2>選項</h2><div class="options-grid"><fieldset class="group opt"><legend>發牌[D]</legend><label><input type="radio" name="draw" value="1" ${S.drawCount===1?'checked':''}>發一張牌[O]</label><label><input type="radio" name="draw" value="3" ${S.drawCount===3?'checked':''}>發三張牌[T]</label></fieldset><fieldset class="group opt"><legend>計分[S]</legend><label><input type="radio" name="mode" value="${MODE_STANDARD}" ${S.mode===MODE_STANDARD?'checked':''}>標準式[A]</label><label><input type="radio" name="mode" value="${MODE_VEGAS}" ${S.mode===MODE_VEGAS?'checked':''}>拉斯維加斯式[V]</label><label><input type="radio" name="mode" value="${MODE_OTHER}" ${S.mode===MODE_OTHER?'checked':''}>不計分[N]</label></fieldset></div><fieldset class="group opt"><label><input type="checkbox" id="timed" ${S.timedGame?'checked':''}>計時遊戲[I]</label><label><input type="checkbox" id="status" ${S.statusDisplay?'checked':''}>狀態顯示[B]</label><label><input type="checkbox" id="outline" ${S.outlineOnly?'checked':''}>移牌時只顯示外框[L]</label><label><input type="checkbox" id="bonus" ${S.scoreBonus?'checked':''} ${S.mode!==MODE_VEGAS?'disabled':''}>增加分數[K]</label></fieldset><div class="actions"><button class="btn" id="optOK">確定</button><button class="btn" data-close>取消</button></div></div>`);
const layer=$('modalLayer');
layer.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{layer.querySelector('#bonus').disabled=+layer.querySelector('input[name=mode]:checked').value!==MODE_VEGAS});
// OPTIONSDLGPROC writes the checkbox globals while the dialog is open. These
// three/four checkbox changes therefore remain even if Cancel is pressed.
['timed','status','outline'].forEach(id=>{layer.querySelector('#'+id).onchange=e=>{const key={timed:'timedGame',status:'statusDisplay',outline:'outlineOnly'}[id];S[key]=e.target.checked;render()}});
layer.querySelector('#bonus').onchange=e=>{if(S.mode===MODE_VEGAS)S.scoreBonus=e.target.checked;render()};
layer.querySelector('#optOK').onclick=()=>{S.drawCount=+layer.querySelector('input[name=draw]:checked').value;S.mode=+layer.querySelector('input[name=mode]:checked').value;S.scoreBonus=layer.querySelector('#bonus').checked;saveSettings();closeModal();const restart=old.timedGame!==S.timedGame||old.drawCount!==S.drawCount||old.mode!==S.mode;if(restart)newGame();else render()};
}
function showBacks(){openModal(`<div class="modal"><button class="close-x" data-close>×</button><h2>指定紙牌花色</h2><div class="back-grid">${BACK_IDS.map(id=>`<button class="back-item ${id===S.backId?'selected':''}" data-back="${id}"><img src="assets/Card_Bitmap_${id}.png" alt="${id}"></button>`).join('')}</div><div class="actions"><button class="btn" id="backOK">確定</button><button class="btn" data-close>取消</button></div></div>`);const layer=$('modalLayer');layer.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{layer.querySelectorAll('[data-back]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');S._draftBack=+b.dataset.back});S._draftBack=S.backId;layer.querySelector('#backOK').onclick=()=>{S.backId=S._draftBack;saveSettings();closeModal();render()}};
function showAbout(){showMessage('接龍','關於',closeModal)}
function action(a){if(a==='new'){newGame();closeMenus()}else if(a==='testwin'){startWinTest()}else if(a==='undo'){restoreUndo();closeMenus()}else if(a==='backs'){showBacks();closeMenus()}else if(a==='options'){showOptions();closeMenus()}else if(a==='about'){showAbout();closeMenus()}else if(a==='exit'){closeMenus()} }
function closeMenus(){$('gameMenu').hidden=true;$('helpMenu').hidden=true;document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'))}
document.querySelectorAll('.menu-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=b.dataset.menu,el=$(n==='game'?'gameMenu':'helpMenu');const open=el.hidden;closeMenus();el.hidden=!open;b.classList.toggle('active',open)});document.querySelectorAll('.dropdown').forEach(m=>m.onclick=e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menubar,.dropdown'))closeMenus()});
window.addEventListener('resize',render,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(render,120),{passive:true});
setInterval(()=>{if(!S.anim)render()},500);
preloadImages().finally(()=>{newGame();});

</script>
</body>
</html>
